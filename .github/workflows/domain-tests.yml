name: Domain contract tests
on:
  push:
    paths:
      - "src/domain/**"
      - "tests/**"
      - "package.json"
      - "prototypes/**"
      - "styles/**"
      - "scripts/**"
      - ".github/workflows/domain-tests.yml"
  pull_request:
    paths:
      - "src/domain/**"
      - "tests/**"
      - "package.json"
      - "prototypes/**"
      - "styles/**"
      - "scripts/**"
      - ".github/workflows/domain-tests.yml"
jobs:
  handoff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify standalone prototype is reproducible
        run: |
          python3 scripts/build-prototype.py
          git diff --exit-code -- prototypes/service-writer-intake.html
          python3 scripts/build-unit-ro-quick-add.py
          git diff --exit-code -- prototypes/unit-ro-quick-add.html
          python3 scripts/build-users-permissions.py
          git diff --exit-code -- prototypes/users-permissions.html
      - name: Run domain and prototype smoke tests
        run: npm test
