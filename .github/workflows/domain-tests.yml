name: Domain contract tests
on:
  push:
    paths:
      - "src/domain/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/domain-tests.yml"
  pull_request:
    paths:
      - "src/domain/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/domain-tests.yml"
jobs:
  handoff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run domain tests
        run: npm test
