/* READABILITY PASS v0.2 — deliberate light operational theme, not OS-dependent. */
:root {
  color-scheme: light;
  --ink: #162b3e;
  --muted: #4d6072;
  --border: #c8d5df;
  --navy: #142b40;
  --blue: #0d5a8a;
  --soft: #e7f2fa;
  --green: #165e4b;
  --warn: #83510e;
  color: var(--ink);
  background: #eff3f7;
  font-size: 14px;
}
html,body { background: #eff3f7; }
body { color: var(--ink); line-height: 1.5; }
button,input,select,textarea { font: inherit; color: var(--ink); }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid #0b72ab !important; outline-offset: 3px; }
a, .backlink { color: #064e7a; }
::selection { background: #b4dced; color: #10283c; }
.sidebar { background: var(--navy); color: #f1f6fa; }
.brand { color: #ffffff; }
.brand span { color: #a4ddfa; }
.side-label { color: #bfcedb; opacity: 1; font-size: 11px; letter-spacing: 1.1px; }
.nav-btn { color: #e5eef5; font-size: 14px; }
.nav-btn:hover, .nav-btn.active { color: #ffffff; background: #31536c; }
.nav-btn.active { box-shadow: inset 3px 0 0 #9fdbff; }
.aside-note { color: #e0eaf0; border-color: #47667f; font-size: 12px; }
.topbar { border-color: var(--border); }
.crumb { color: #405a6d; font-size: 13px; }
.topbar b { color: #172f43; }
.pilot { background: #fff2d5; color: #70430c; border-color: #d7a857; font-size: 11px; }
.eyebrow { color: #275877; font-size: 12px; }
h1,h2,h3 { color: #152a3d; }
h1 { font-size: 29px; }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
.subtitle { color: #405468; font-size: 14px; }
.subtitle strong { color: #1c364d; }
.card { border-color: var(--border); box-shadow: 0 2px 12px rgb(27 53 72 / 5%); }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }
.step { color: #4b6070; border-color: #c1cfdb; font-size: 13px; }
.step span { background: #dfe8ef; color: #2a475d; font-weight: 800; }
.step.active { color: #095b8d; border-color: #0d6398; }
.step.active span { color: #084f7b; background: #d5eaf8; }
.step.done { color: #186348; border-color: #288364; }
.step.done span { color: #15533c; background: #d8f0e6; }
.field label { color: #22374a; font-size: 13px; }
.field input,.field select,.field textarea { color: #132c41; background: #fff; border: 1.5px solid #98afc0; border-radius: 7px; font-size: 14px; min-height: 44px; }
.field input::placeholder,.field textarea::placeholder { color: #566d7d; opacity: 1; }
.field input:hover,.field select:hover,.field textarea:hover { border-color: #557f9b; }
.field input:focus,.field select:focus,.field textarea:focus { border-color: #0d6499; box-shadow: 0 0 0 3px #0d649921; outline: none; }
.hint { color: #53687b; font-size: 12px; }
.seg button { color: #172c3c; background: #fff; border: 1.5px solid #b3c7d5; }
.seg button:hover { background: #f4f9fc; border-color: #5d90af; }
.seg button.selected { color: #0f344c; background: #e1f1fa; border-color: #0d6398; box-shadow: inset 0 0 0 1px #0d6398; }
.seg strong { color: inherit; font-size: 14px; }
.seg span { color: #405c71; font-size: 12px; }
.btn { color: #173c55; background: #fff; border: 1.5px solid #94b0c3; padding: 11px 16px; font-size: 13px; }
.btn:hover:not(:disabled) { background: #f1f7fb; border-color: #487d9d; }
.btn.primary { background: #0c5f91; color: #fff; border-color: #0c5f91; }
.btn.primary:hover:not(:disabled) { background: #094b75; border-color: #094b75; }
.btn.secondary { background: #e6f2fa; color: #0d4c75; border-color: #9ac1d8; }
.btn.secondary:hover:not(:disabled) { background: #d8ebf7; border-color: #5b91b0; }
.btn.danger { color: #82390c; border-color: #b88c71; }
.btn.danger:hover:not(:disabled) { background: #fff1e7; }
button:disabled,.btn:disabled { color: #536b7b; background: #e6ebef; border-color: #bdc9d1; opacity: 1; cursor: not-allowed; }
.callout { border-color: #0d6799; background: #e9f4fb; color: #19374b; font-size: 13px; }
.callout strong { color: #0c547e; }
.callout.warning { background: #fff4dc; color: #5f3b10; border-color: #ad700e; }
.flag { background: #e0f2e7; color: #16583d; font-size: 11px; }
.flag.pending { background: #fff2d1; color: #6d440c; }
.flag.blue { background: #e0f0fa; color: #115a88; }
.stat { background: #f5f8fa; border-color: #cddce5; }
.stat span { color: #4c6174; font-size: 12px; }
.stat strong { color: #1b3549; font-size: 15px; }
.ro-row,.list li { border-color: #dbe5eb; font-size: 13px; }
.line { background: #f2f7fa; color: #1e3546; border-color: #94b9ce; font-size: 13px; }
.timeline { border-color: #b3cddf; }
.timeline-card,.queue-card,.unitcard { border-color: #c8d9e4; }
.timeline-title { font-size: 14px; color: #192f42; }
.event { border-color: #dbe5ec; font-size: 13px; }
.event time { color: #405e72; font-variant-numeric: tabular-nums; }
.event .muted { font-size: 12px; }
.pill { color: #315a72; background: #f2f8fb; border-color: #b8cfdd; font-size: 11px; }
.kpi span { color: #486377; font-size: 12px; }
.message { background: #e0f3e8; border-color: #a4d0b7; color: #15583d; font-size: 13px; }
.error { background: #fff0e9; border-color: #dcac9a; color: #872e1c; font-size: 13px; }
.empty { border-color: #a9c2d2; color: #4e6677; font-size: 14px; }
.badge-outline { color: #36596e; background: #f3f8fb; border-color: #b9d2e0; font-size: 12px; }
@media (max-width: 1030px) {
  .sidebar .nav-btn { font-size: 0; }
  .sidebar .nav-btn::before { font-size: 21px; }
}
@media (max-width: 730px) {
  h1 { font-size: 25px; }
  h2 { font-size: 19px; }
  .step { font-size: 12px; }
  .timeline-header { flex-wrap: wrap; }
  .timeline-header .btn { min-height: 40px; }
  .event { gap: 8px; }
  .event time { width: 70px; flex-basis: 70px; }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}



/* SHARED DESIGN SYSTEM — component rules consume semantic tokens, never screen-specific palettes. */
html,body{color:var(--os-ink);background:var(--os-canvas)}
:focus-visible{outline-color:var(--os-focus)!important}
.sidebar{background:var(--os-sidebar);color:var(--os-sidebar-text)}
.brand span{color:var(--os-sidebar-highlight)}
.nav-btn{color:var(--os-sidebar-text)}
.nav-btn:hover,.nav-btn.active{background:var(--os-nav-active);color:#fff}
.nav-btn.active{box-shadow:inset 3px 0 0 var(--os-sidebar-highlight)}
.main,.content{background:var(--os-canvas)}
.topbar,.card,.seg button,.timeline-card,.queue-card,.unitcard{background:var(--os-surface)}
.topbar,.card,.timeline-card,.queue-card,.unitcard{border-color:var(--os-line)}
.crumb,.subtitle,.muted,.hint,.event time,.setting-row .muted{color:var(--os-muted)}
.crumb b,.topbar b,h1,h2,h3,.timeline-title,.field label,.setting-row strong{color:var(--os-ink)}
.eyebrow{color:var(--os-accent-dark)}
.step{border-color:var(--os-line);color:var(--os-muted)}
.step.active{color:var(--os-accent-dark);border-color:var(--os-accent)}
.step.active span{background:var(--os-accent-soft);color:var(--os-accent-dark)}
.seg button{border-color:var(--os-line);color:var(--os-ink)}
.seg button.selected,.theme-card.selected{background:var(--os-accent-soft);border-color:var(--os-accent);box-shadow:inset 0 0 0 1px var(--os-accent)}
.seg button:hover{border-color:var(--os-accent)}
.seg span{color:var(--os-muted)}
.field input,.field select,.field textarea,.setting-row select,.lookup-controls input{color:var(--os-ink);border-color:var(--os-input-line);background:var(--os-surface)}
.field input:hover,.field select:hover,.field textarea:hover,.setting-row select:hover,.lookup-controls input:hover{border-color:var(--os-accent)}
.field input:focus,.field select:focus,.field textarea:focus,.setting-row select:focus,.lookup-controls input:focus{border-color:var(--os-accent);box-shadow:0 0 0 3px var(--os-focus-wash)}
.btn{background:var(--os-surface);border-color:var(--os-input-line);color:var(--os-accent-dark)}
.btn:hover:not(:disabled){background:var(--os-accent-soft);border-color:var(--os-accent)}
.btn.primary{background:var(--os-accent);color:#fff;border-color:var(--os-accent)}
.btn.primary:hover:not(:disabled){background:var(--os-accent-hover);border-color:var(--os-accent-hover)}
.btn.secondary{background:var(--os-accent-soft);color:var(--os-accent-dark);border-color:var(--os-accent-line)}
.btn.secondary:hover:not(:disabled){background:var(--os-accent-soft);border-color:var(--os-accent)}
.callout{background:var(--os-accent-soft);border-color:var(--os-accent);color:var(--os-ink)}
.callout strong,.backlink{color:var(--os-accent-dark)}
.timeline{border-color:var(--os-accent-line)}
.timeline-card:before{background:var(--os-accent);box-shadow:0 0 0 2px var(--os-accent-line)}
.timeline-card.future:before{background:#be7b17;box-shadow:0 0 0 2px #e9cf9d}
.pill,.badge-outline{background:var(--os-accent-soft);color:var(--os-accent-dark);border-color:var(--os-accent-line)}
.stat,.line{background:var(--os-surface-muted);color:var(--os-ink);border-color:var(--os-line)}
.settings-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.settings-group{padding:9px 0 12px;border-top:1px solid var(--os-line)}
.settings-group h3{margin:15px 0 5px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--os-line);padding:12px 0}
.setting-row .muted{margin:3px 0 0;max-width:590px;font-size:12px}
.setting-row strong{font-size:13px}
.setting-row select{border:1.5px solid var(--os-input-line);border-radius:7px;min-width:150px;min-height:42px;padding:8px 10px;font-size:13px}
.required-mark{color:#9d3b28;font-weight:900;margin-left:3px}
.optional-mark{font-size:11px;color:var(--os-muted);font-weight:500;margin-left:5px}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.theme-card{border:1.5px solid var(--os-line);border-radius:10px;padding:17px;background:var(--os-surface);color:var(--os-ink);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:166px}
.theme-card strong{font-size:14px}
.theme-card small{font-size:12px;color:var(--os-muted)}
.theme-selected{font-size:12px;font-weight:800;color:var(--os-accent-dark);margin-top:auto}
.theme-swatch{width:45px;height:22px;border-radius:5px;border:1px solid #8495a3}
.lookup-panel{background:var(--os-surface-muted);border:1px solid var(--os-line);border-radius:9px;padding:14px;margin:10px 0 20px}
.lookup-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.lookup-controls{display:flex;gap:8px;margin-bottom:12px}
.lookup-controls input{flex:1;min-width:0;border:1.5px solid var(--os-input-line);border-radius:7px;padding:9px 11px;min-height:44px}
.lookup-results{display:grid;gap:8px}
.lookup-result{background:var(--os-surface);border:1px solid var(--os-line);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-radius:7px}
.lookup-result .muted{font-size:12px}
@media(max-width:730px){.setting-row{align-items:stretch;flex-direction:column;gap:8px}.setting-row select{width:100%}.theme-grid{grid-template-columns:1fr}.lookup-controls{flex-wrap:wrap}.lookup-controls input{flex-basis:100%}.lookup-result{align-items:flex-start;flex-direction:column}.lookup-result .btn{width:100%}.lookup-title{align-items:flex-start;flex-direction:column}}

<body><div class="app"><aside class="sidebar"><div class="brand">ONE<span>SHOP</span></div><div class="side-label">Operations</div><button class="nav-btn active" data-icon="▣" data-page="checkin">Service Writer · Intake</button><button class="nav-btn" data-icon="↔" data-page="porter">Porter Queue</button><button class="nav-btn" data-icon="◷" data-page="customer">Customer Timeline</button><div class="side-label">Configuration</div><button class="nav-btn" data-icon="▦" data-page="map">Space Types / Map</button><button class="nav-btn" data-icon="⚙" data-page="settings">Settings</button><div class="aside-note"><b>Prototype</b><br>Click through check-in, request a type-based move, claim and confirm it, and inspect the customer's resulting timeline. All data is local to this page.</div></aside><div class="main"><header class="topbar"><div class="crumb">OneShop <b> / <span id="breadcrumb">Service Writer · Intake</span></b></div><span class="pilot">WORKFLOW PROTOTYPE · NOT CONNECTED</span></header><main class="content" id="root"></main></div></div>
<script>
'use strict';
const types=[{id:'dropoff',name:'Customer Drop-off',prefix:'DO',spaces:['DO-01','DO-02'],area:true,capacity:8},{id:'storage',name:'Service Storage',prefix:'SS',spaces:['SS-01','SS-02','SS-03','SS-04'],capacity:1},{id:'bay',name:'Service Bay',prefix:'SB',spaces:['SB-01','SB-02','SB-03'],capacity:1},{id:'wash',name:'Wash Bay',prefix:'WB',spaces:['WB-01','WB-02'],capacity:1},{id:'detail',name:'Detail Bay',prefix:'DB',spaces:['DB-01'],capacity:1},{id:'pdi',name:'PDI Staging',prefix:'PDI',spaces:['PDI-01','PDI-02'],capacity:1},{id:'waiter',name:'Waiter Way',prefix:'WW',spaces:['WW-01','WW-02'],capacity:1}];
// Settings are demonstration-only: persisted in this browser, not to an organization database.
const SETTINGS_KEY='oneshop.prototype.shop-settings.v3';
const configurableFields=[
 {group:'Customer & contact',path:'customer.name',title:'Customer / account name',help:'An unassigned customer is permitted until the correct account is linked.'},
 {group:'Customer & contact',path:'customer.phone',title:'Primary phone',help:'Do not block inventory receiving if there is no customer phone.'},
 {group:'Customer & contact',path:'customer.email',title:'Email address',help:'A customer can have multiple contact methods in the production model.'},
 {group:'Unit identification',path:'unit.vin',title:'VIN / serial identifier',help:'Either VIN or stock number must identify the unit at check-in.'},
 {group:'Unit identification',path:'unit.stock',title:'Stock number',help:'Can replace required VIN for dealerships using stock-number workflows.'},
 {group:'Unit information',path:'unit.year',title:'Year',help:'Can be completed later if unavailable at arrival.'},
 {group:'Unit information',path:'unit.make',title:'Make',help:'Reuses saved unit details when selected from search.'},
 {group:'Unit information',path:'unit.model',title:'Model',help:'Reuses saved unit details when selected from search.'},
 {group:'Repair order',path:'ro',title:'RO number',help:'An unnamed draft RO may be linked to the visit and numbered later.'},
 {group:'Repair order',path:'scope',title:'Initial line-item description',help:'A line can remain pending when the specific work is not yet known.'},
 {group:'Repair order',path:'advisor',title:'Responsible service writer',help:'An unassigned queue must retain responsibility until assignment.'},
 {group:'Receipt',path:'keyStatus',title:'Keys / packet custody',help:'Unknown or missing keys must be flagged before a move.'},
 {group:'Receipt',path:'promised',title:'Customer pickup commitment',help:'Do not invent a customer promise.'},
 {group:'Receipt',path:'notes',title:'Condition / receipt notes',help:'Optional condition or handling remarks.'}
];
const defaultRules={
 customer:{'customer.name':'required','customer.phone':'optional','customer.email':'optional','unit.vin':'required','unit.stock':'optional','unit.year':'optional','unit.make':'optional','unit.model':'optional',ro:'required',scope:'required',advisor:'required',keyStatus:'required',promised:'optional',notes:'optional'},
 inventory:{'customer.name':'optional','customer.phone':'hidden','customer.email':'hidden','unit.vin':'optional','unit.stock':'required','unit.year':'optional','unit.make':'optional','unit.model':'optional',ro:'optional',scope:'optional',advisor:'required',keyStatus:'required',promised:'hidden',notes:'optional'}
};
const themes=[{id:'classic',title:'Classic blue',detail:'Approved OneShop baseline',swatch:'#0c5f91'},{id:'slate',title:'Graphite',detail:'Neutral operational theme',swatch:'#475569'},{id:'forest',title:'Forest',detail:'Muted green accent',swatch:'#216b53'}];
const copy=v=>JSON.parse(JSON.stringify(v));
function loadSettings(){let saved={};try{saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')||{}}catch(e){}const merged={theme:themes.some(t=>t.id===saved.theme)?saved.theme:'classic',profiles:copy(defaultRules)};for(const p of ['customer','inventory']){for(const f of configurableFields){const x=saved.profiles?.[p]?.[f.path];if(['required','optional','hidden'].includes(x))merged.profiles[p][f.path]=x;}}return merged;}
function persistSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(state.config));return true}catch(e){state.error='Browser storage unavailable: your settings are active for this session only.';return false}}
function setTheme(v){state.config.theme=v;document.documentElement.dataset.theme=v;persistSettings();state.notice='Appearance saved for this prototype. All views use the same theme tokens.';state.error='';render()}
function requiredMode(path,opts={}){if(!configurableFields.some(f=>f.path===path))return opts.required?'required':'optional';return state.config.profiles[state.checkinType][path]||'optional'}
const demoDirectory=[{id:'C-001',unitId:'U-002',name:'Jordan Ellis',phone:'(707) 555-0169',email:'jordan@example.com',kind:'RV',year:'2022',make:'Grand Design',model:'Reflection 311BHS',vin:'573FR3827N9924101',stock:'',ro:'RO-10482',scope:'Investigate freshwater pump noise and intermittent low pressure'},
 {id:'C-014',unitId:'U-047',name:'Summit Auto Group',phone:'(707) 555-0140',email:'receiving@example.com',kind:'RV',year:'2025',make:'Airstream',model:'Flying Cloud',vin:'',stock:'INV-0472',ro:'',scope:''}];
function unitIdentifier(){return state.unit.vin?.trim()||state.unit.stock?.trim()||'Unit identifier pending'}
function accountLabel(){return state.customer.name?.trim()||'Unassigned customer / internal account'}
function roLabel(){return state.ro?.trim()||'Draft RO · number pending'}
function showRule(path){return requiredMode(path)!=='hidden'}
const now=()=>new Date().toISOString(); const short=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); const tm=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'checkin',step:0,done:false,notice:'',error:'',checkinType:'customer',customer:{name:'Jordan Ellis',phone:'(707) 555-0169',email:'jordan@example.com'},unit:{kind:'RV',year:'2022',make:'Grand Design',model:'Reflection 311BHS',vin:'573FR3827N9924101',stock:''},ro:'RO-10482',scope:'Investigate freshwater pump noise and intermittent low pressure',extraLines:[],extraROs:[],advisor:'Avery Chen',notes:'',arrival:'DO-01',keyStatus:'Cabinet intake',urgency:'routine',promised:'',location:'DO-01',move:{pickup:'DO-01',type:'storage',space:'',priority:'normal',note:''},requests:[],eventLog:[],visitId:'',expanded:true,filter:'90',unitFilter:'all',config:loadSettings(),settingsProfile:'customer',settingsTab:'fields',lookupQuery:'',matchedRecord:''};
const save=(key,value)=>{state[key]=value;state.error=''};
const root=document.getElementById('root');
function nav(page){state.page=page;state.notice='';state.error='';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('breadcrumb').textContent={checkin:'Service Writer · Intake',porter:'Porter Queue',customer:'Customer Timeline',map:'Location Configuration',settings:'Dealership Settings'}[page];render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function setField(path,v){let [a,b]=path.split('.');if(b)state[a][b]=v;else state[a]=v;state.error=''}
function field(path,label,opts={}){const mode=requiredMode(path,opts);if(mode==='hidden')return '';const parts=path.split('.');let value=parts.length===2?state[parts[0]][parts[1]]:state[path];let attrs=`data-bind="${esc(path)}" ${mode==='required'?'required aria-required="true"':''}`;let input=opts.options?`<select ${attrs}>${opts.options.map(o=>`<option value="${esc(o[0])}" ${value===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:opts.long?`<textarea ${attrs} placeholder="${esc(opts.placeholder||'')}">${esc(value)}</textarea>`:`<input ${attrs} type="${opts.type||'text'}" value="${esc(value)}" placeholder="${esc(opts.placeholder||'')}">`;return `<div class="field"><label>${esc(label)} ${mode==='required'?'<span class="required-mark" aria-label="required">*</span>':'<span class="optional-mark">Optional</span>'}</label>${input}${opts.hint?`<p class="hint">${esc(opts.hint)}</p>`:''}</div>`}
function bind(){root.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('input',e=>{setField(el.dataset.bind,e.target.value);if(el.dataset.bind==='move.type')render()}));root.querySelectorAll('[data-extra-line]').forEach(el=>el.addEventListener('input',e=>state.extraLines[+el.dataset.extraLine]=e.target.value));root.querySelectorAll('[data-extra-ro-number]').forEach(el=>el.addEventListener('input',e=>state.extraROs[+el.dataset.extraRoNumber].number=e.target.value));root.querySelectorAll('[data-extra-ro-scope]').forEach(el=>el.addEventListener('input',e=>state.extraROs[+el.dataset.extraRoScope].scope=e.target.value))}
function msg(){return (state.error?`<div class="error">${esc(state.error)}</div>`:'')+(state.notice?`<div class="message">${esc(state.notice)}</div>`:'')}
function title(kicker,heading,description){return `<div class="eyebrow">${esc(kicker)}</div><h1>${esc(heading)}</h1><p class="subtitle">${description}</p>`}
function stages(){let names=['Routing','Customer & unit','Repair orders','Receipt'];return `<div class="steps">${names.map((n,i)=>`<div class="step ${i===state.step?'active':i<state.step?'done':''}"><span>${i<state.step?'✓':i+1}</span>${n}</div>`).join('')}</div>`}
function checkin(){if(state.done){postCheckin();return}let content='';
if(state.step===0)content=`<h2>What type of unit is being received?</h2><p class="subtitle">The intake classification determines the recommended processing flow. It does not change the core Customer → Unit → RO → Line Item record structure.</p><div class="seg"><button class="${state.checkinType==='customer'?'selected':''}" data-type="customer"><strong>Customer Unit · Service</strong><span>Repair, diagnosis, warranty or customer service. Usually routed to Service Storage after receipt.</span></button><button class="${state.checkinType==='inventory'?'selected':''}" data-type="inventory"><strong>New Unit · Inventory</strong><span>New dealership inventory, receiving or PDI. Usually routed to PDI Staging.</span></button></div><div class="grid2">${field('urgency','Processing priority',{options:[['routine','Routine processing'],['waiter','Waiter / express'],['restricted','Non-drivable / special handling']]})}<div class="callout"><strong>System recommendation</strong>${esc(state.urgency==='waiter'?'Move to Waiter Way':state.checkinType==='inventory'?'Stage for PDI':'Move to Service Storage')} is suggested after check-in. The service writer is not expected to choose an individual numbered parking space.</div></div>`;
if(state.step===1)content=`<h2>Identify the customer and unit</h2><p class="subtitle">Look up existing records first. The shop's <b>${state.checkinType==='customer'?'Customer Service':'New Inventory'}</b> requirements decide which details are required, optional or hidden.</p><div class="lookup-panel"><div class="lookup-title"><strong>Find existing customer / unit</strong><span class="pill">Demo directory · no database</span></div><div class="lookup-controls"><input id="lookup" value="${esc(state.lookupQuery)}" placeholder="Search name, VIN, stock number or RO" aria-label="Search existing records"><button class="btn secondary" id="lookup-search">Search</button><button class="btn" id="clear-new">New record</button></div><div class="lookup-results">${demoDirectory.filter(x=>(x.name+' '+x.vin+' '+x.stock+' '+x.ro).toLowerCase().includes(state.lookupQuery.toLowerCase())).map(x=>`<div class="lookup-result"><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.year+' '+x.make+' '+x.model)} · ${esc(x.vin||x.stock)} · Customer ${esc(x.id)}, Unit ${esc(x.unitId)}</div></div><button class="btn" data-use-record="${esc(x.unitId)}">Use saved record</button></div>`).join('')||'<div class="muted">No matches in demonstration directory. Enter a new record below.</div>'}</div>${state.matchedRecord?`<div class="message">Existing unit ${esc(state.matchedRecord)} matched. Its identifiers will be reused, not recreated.</div>`:''}</div><div class="grid2"><div><h3>Customer / responsible account</h3>${field('customer.name','Customer / account name')}${field('customer.phone','Primary phone')}${field('customer.email','Email address',{type:'email'})}</div><div><h3>Unit (RV or vehicle)</h3>${field('unit.kind','Type',{required:true,options:[['RV','RV / travel trailer / motorhome'],['Vehicle','Other vehicle']]})}<div class="grid2">${field('unit.year','Year')}${field('unit.make','Make')}</div>${field('unit.model','Model')}${field('unit.vin','VIN / serial identifier')}${field('unit.stock','Stock number')}</div></div><div class="callout"><strong>Unit identity rule</strong>Provide at least one usable VIN / serial or stock number, even if both individual fields are marked optional. A hidden identifier may still be preserved on an existing saved unit.</div>`;
if(state.step===2)content=`<h2>Associate repair orders and work</h2><p class="subtitle">Use an existing RO when one is already known. A draft RO can be created without a number if this shop permits it. A single unit may have multiple simultaneous ROs.</p><div class="grid2">${field('ro','Repair order number')}${field('advisor','Responsible service writer')}</div>${field('scope','RO 1 · Line item 01',{long:true,placeholder:'Customer concern or receiving work scope'})}${state.extraLines.map((v,i)=>showRule('scope')?`<div class="field"><label>RO 1 · Line item ${String(i+2).padStart(2,'0')} ${requiredMode('scope')==='required'?'<span class="required-mark">*</span>':'<span class="optional-mark">Optional</span>'}</label><input data-extra-line="${i}" value="${esc(v)}" placeholder="Additional work or customer concern"></div>`:'').join('')}${showRule('scope')?'<button class="btn" id="addline" type="button">+ Add line item</button>':''}<div class="divider"></div>${state.extraROs.map((r,i)=>`<div class="grid2">${showRule('ro')?`<div class="field"><label>RO ${i+2} · Number ${requiredMode('ro')==='required'?'<span class="required-mark">*</span>':'<span class="optional-mark">Optional</span>'}</label><input data-extra-ro-number="${i}" value="${esc(r.number)}" placeholder="RO number if assigned"></div>`:''}${showRule('scope')?`<div class="field"><label>RO ${i+2} · Line item 01 ${requiredMode('scope')==='required'?'<span class="required-mark">*</span>':'<span class="optional-mark">Optional</span>'}</label><input data-extra-ro-scope="${i}" value="${esc(r.scope)}" placeholder="Work scope if known"></div>`:''}</div>`).join('')}<button class="btn secondary" id="addro" type="button">+ Add another RO</button><div class="callout"><strong>Business hierarchy</strong>${esc(accountLabel())} → ${esc(state.unit.make+' '+state.unit.model)} → ${1+state.extraROs.length} RO(s). ${esc(state.matchedRecord?'Existing unit reused. ':'')}One physical unit/location for all related ROs.</div>`;
if(state.step===3)content=`<h2>Confirm physical receipt</h2><p class="subtitle">Record where the unit actually is and whether it can safely be moved. The arrival area is not the final parking assignment.</p><div class="grid2">${field('arrival','Receiving / pickup location',{required:true,options:types.find(t=>t.id==='dropoff').spaces.map(x=>[x,x])})}${field('keyStatus','Key / packet status',{options:[['Cabinet intake','Keys checked in at service desk'],['With unit','Keys / packet with unit'],['Missing / unresolved','Missing keys or custody unresolved']]})}${field('promised','Customer pickup commitment (if agreed)',{type:'datetime-local',hint:'Never invent a promise or copy a shop estimate into a customer commitment.'})}${field('notes','Receipt notes / visible condition',{long:true,placeholder:'Existing damage, handling restrictions, photos to be added'})}</div><div class="callout warning"><strong>Next action after finishing</strong>The visit is recorded as checked in. A Move Unit action will be offered. A move request never changes the unit's confirmed physical location until the porter confirms delivery.</div>`;
root.innerHTML=title('Workflow 01 / Unit arrival','Service Writer Check-In','Receive the customer, identify the unit and its work, confirm physical arrival, and route it to the next operational department.')+msg()+`<div class="card">${stages()}${content}<div class="actions"><button class="btn" id="back" ${state.step===0?'disabled':''}>Back</button><div class="right"><button class="btn primary" id="next">${state.step===3?'Finish Check-In':'Continue'}</button></div></div></div>`;bind();root.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{state.checkinType=b.dataset.type;render()}));if(state.step===1){const lookup=root.querySelector('#lookup');lookup.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();state.lookupQuery=lookup.value;render()}});root.querySelector('#lookup-search').onclick=()=>{state.lookupQuery=lookup.value;render()};root.querySelector('#clear-new').onclick=()=>{state.customer={name:'',phone:'',email:''};state.unit={kind:'RV',year:'',make:'',model:'',vin:'',stock:''};state.ro='';state.scope='';state.extraLines=[];state.extraROs=[];state.matchedRecord='';state.notice='New customer/unit entry selected.';render()};root.querySelectorAll('[data-use-record]').forEach(b=>b.onclick=()=>{const x=demoDirectory.find(d=>d.unitId===b.dataset.useRecord);state.customer={name:x.name,phone:x.phone,email:x.email};state.unit={kind:x.kind,year:x.year,make:x.make,model:x.model,vin:x.vin,stock:x.stock};state.ro=x.ro;state.scope=x.scope;state.matchedRecord=x.unitId;state.notice='Matched existing customer and unit. Existing details have been reused.';render()})}if(state.step===2){const addline=root.querySelector('#addline');if(addline)addline.onclick=()=>{state.extraLines.push('');render()};root.querySelector('#addro').onclick=()=>{state.extraROs.push({number:'',scope:''});render()}}root.querySelector('#back').onclick=()=>{if(state.step>0)state.step--;render()};root.querySelector('#next').onclick=()=>{if(!validateStep())return;if(state.step===3)finish();else {state.step++;render()}}}
function validateStep(){const cfg=state.config.profiles[state.checkinType];const missing=(k,v)=>cfg[k]==='required'&&!String(v??'').trim();if(state.step===1){const required=['customer.name','customer.phone','customer.email','unit.vin','unit.stock','unit.year','unit.make','unit.model'];let absent=required.filter(k=>missing(k,k.includes('.')?state[k.split('.')[0]][k.split('.')[1]]:''));if(absent.length){state.error='Required information missing: '+absent.map(k=>configurableFields.find(f=>f.path===k).title).join(', ')+'.';render();return false}if(!state.unit.vin.trim()&&!state.unit.stock.trim()){state.error='At least one unit identifier is required: VIN / serial or stock number.';render();return false}if(state.customer.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.customer.email.trim())){state.error='Enter a valid email address or leave it blank when the shop profile allows that.';render();return false}}if(state.step===2){let absent=[];if(missing('ro',state.ro))absent.push('RO number');if(missing('scope',state.scope))absent.push('Line item');if(missing('advisor',state.advisor))absent.push('Responsible service writer');for(const [i,r] of state.extraROs.entries()){if(missing('ro',r.number))absent.push('RO '+(i+2)+' number');if(missing('scope',r.scope))absent.push('RO '+(i+2)+' line item')}if(cfg.scope==='required'&&state.extraLines.some(x=>!x.trim()))absent.push('Additional line item description');const populated=[state.ro,...state.extraROs.map(x=>x.number)].map(x=>x.trim()).filter(Boolean);if(new Set(populated).size!==populated.length)absent.push('RO numbers must be unique');if(absent.length){state.error='Check-in requires: '+absent.join(', ')+'.';render();return false}}if(state.step===3&&missing('keyStatus',state.keyStatus)){state.error='Record key custody or explicitly flag it as missing.';render();return false}return true}
function event(type,label,details){state.eventLog.push({id:'e'+(state.eventLog.length+1),type,label,details,at:now(),visit:state.visitId,unit:unitIdentifier()})}
function finish(){if(state.done)return;state.done=true;state.visitId='V-2026-001';state.location=state.arrival;state.move.pickup=state.location;state.move.type=state.urgency==='waiter'?'waiter':state.checkinType==='inventory'?'pdi':'storage';state.move.space='';event('checkin','Service Writer Check-In',`${accountLabel()} · ${[state.ro,...state.extraROs.map(x=>x.number)].filter(Boolean).join(', ')||'Draft RO'} · ${state.arrival}`);state.notice='Check-in recorded in the prototype. Recommended next action: Move Unit.';render()}
function postCheckin(){const t=types.find(x=>x.id===state.move.type);let queued=state.requests.find(r=>r.status!=='delivered'&&r.status!=='canceled');root.innerHTML=title('Workflow 01 / Next action','Check-In Complete','The unit has been received. Select its next destination by area or space type; specific space allocation is optional.')+msg()+`<div class="kpi"><div class="card"><span>Customer</span><strong>${esc(accountLabel())}</strong></div><div class="card"><span>Unit / identifier</span><strong>${esc(unitIdentifier().slice(-12))}</strong></div><div class="card"><span>Confirmed position</span><strong>${esc(state.location)}</strong></div></div><div class="two-col"><section class="card"><div class="card-head"><div><h2>Move Unit</h2><p class="muted">System recommendation: ${esc(state.urgency==='waiter'?'Waiter Way':state.checkinType==='inventory'?'PDI Staging':'Service Storage')}</p></div><span class="flag blue">Next action</span></div>${queued?`<div class="callout warning"><strong>Move already in progress</strong>${esc(queued.id)} is ${esc(queued.status)}. Open Porter Queue to progress it.</div>`:''}<div class="grid2">${field('move.pickup','Pickup location',{options:[state.location,state.arrival,...types.flatMap(x=>x.spaces)].filter((x,i,a)=>a.indexOf(x)===i).map(x=>[x,x])})}${field('move.type','Destination space / area type',{options:types.filter(x=>x.id!=='dropoff').map(x=>[x.id,x.name])})}</div>${field('move.space','Specific numbered space (optional)',{options:[['','No specific space · assign at dispatch'],...t.spaces.map(x=>[x,x])]})}<div class="grid2">${field('move.priority','Priority',{options:[['normal','Normal'],['urgent','Urgent']]})}${field('move.note','Porter instructions',{placeholder:'Handling, key bag, access notes'})}</div><div class="actions"><button class="btn" id="skip">Skip for now</button><div class="right"><button class="btn primary" id="request" ${queued||state.urgency==='restricted'||state.keyStatus==='Missing / unresolved'?'disabled':''}>${s function customer(){const cutoff=state.filter==='all'?-Infinity:Date.now()-Number(state.filter)*86400000;const events=state.eventLog.filter(e=>e.visit===state.visitId&&new Date(e.at).getTime()>=cutoff&&(state.unitFilter==='all'||e.unit===unitIdentifier()));const hasVisit=state.done&&events.length>0;const expanded=state.expanded;root.innerHTML=title('Customer record / Primary view',accountLabel(),'The customer timeline is the first substantive component. Service visits stay grouped, and their detailed events expand beneath the main history.')+`<div class="card"><div class="card-head"><div><div class="eyebrow">Customer profile</div><div class="tagline"><span class="badge-outline">${esc(state.customer.phone||'No phone')}</span><span class="badge-outline">${esc(state.customer.email||'No email')}</span></div></div><button class="btn secondary" id="checkin-new">${hasVisit?'View current check-in':'Start check-in'}</button></div></div><div class="card"><div class="card-head"><div><h2>Customer Timeline</h2><p class="muted">Service visits, milestones, recommendations and future reminders.</p></div><span class="pill">Primary customer component</span></div><div class="grid2"><div class="field"><label>Time period</label><select id="period"><option value="30" ${state.filter==='30'?'selected':''}>Last 30 days</option><option value="90" ${state.filter==='90'?'selected':''}>Last 90 days</option><option value="365" ${state.filter==='365'?'selected':''}>Last 12 months</option><option value="all" ${state.filter==='all'?'selected':''}>All time</option></select></div><div class="field"><label>Unit</label><select id="unitselect"><option value="all">All customer units</option><option value="current" ${state.unitFilter==='current'?'selected':''}>${esc(state.unit.make+' '+state.unit.model+' · '+unitIdentifier().slice(-6))}</option></select></div></div><div class="timeline"><div class="timeline-card future"><div class="timeline-header"><div><div class="timeline-title">Future follow-up / recommendation</div><span class="muted">Scheduled · Example only</span></div><span class="flag pending">Future</span></div><p class="muted">Recommended service and advisor follow-ups appear here as future items, not as work already performed.</p></div>${hasVisit?`<div class="timeline-card"><div class="timeline-header"><div><div class="timeline-title">Service Visit · ${esc(short(events[0].at))}</div><p class="muted">${esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)} · ${esc([state.ro,...state.extraROs.map(x=>x.number)].filter(Boolean).join(', ')||'Draft RO')} · Current: ${esc(state.location)}</p></div><button class="btn secondary" id="expand">${expanded?'Hide details':'Expand visit'}</button></div>${expanded?`<div class="timeline-inner">${events.map(e=>`<div class="event"><time>${esc(tm(e.at))}</time><div><b>${esc(e.label)}</b><div class="muted">${esc(e.details)}</div></div></div>`).join('')}</div>`:''}</div>`:`<div class="empty">No recorded service visit in this prototype.<br>Complete check-in to see its timeline group and expandable milestones.</div>`}</div></div><div class="card"><div class="card-head"><div><h2>Customer Units</h2><p class="muted">Each unit has a dedicated history, even if its owner changes later.</p></div><span class="pill">1 unit in demo</span></div><div class="unitcard"><div><b>${esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)}</b><p class="muted">${esc(state.unit.kind)} · Identifier ${esc(unitIdentifier())} · ${hasVisit?'On site at '+state.location:'No active visit recorded'}</p></div><button class="btn" id="history">View history</button></div></div>`;root.querySelector('#checkin-new').onclick=()=>nav('checkin');root.querySelector('#history').onclick=()=>{state.expanded=true;render();window.scrollTo({top:0,behavior:'smooth'})};root.querySelector('#period').onchange=e=>{state.filter=e.target.value;render()};root.querySelector('#unitselect').onchange=e=>{state.unitFilter=e.target.value;render()};if(root.querySelector('#expa function settingsPage(){const profile=state.settingsProfile;const fieldRows=configurableFields.reduce((acc,f)=>{(acc[f.group]??=[]).push(f);return acc},{});const modeOptions=[['required','Required'],['optional','Optional'],['hidden','Hidden']];let fieldsHtml=Object.entries(fieldRows).map(([group,items])=>`<div class="settings-group"><h3>${esc(group)}</h3>${items.map(f=>`<div class="setting-row"><div><strong>${esc(f.title)}</strong><p class="muted">${esc(f.help)}</p></div><select data-setting-field="${esc(f.path)}" aria-label="${esc(f.title)} requirement">${modeOptions.map(([value,label])=>`<option value="${value}" ${state.config.profiles[profile][f.path]===value?'selected':''}>${label}</option>`).join('')}</select></div>`).join('')}</div>`).join('');let appearance=`<div class="callout"><strong>Shared design system</strong>One set of semantic color tokens controls the sidebar, background, forms, cards, buttons and timeline across every screen. Changes apply instantly to this prototype and persist in this browser.</div><div class="theme-grid">${themes.map(t=>`<button class="theme-card ${state.config.theme===t.id?'selected':''}" data-theme-choice="${t.id}"><span class="theme-swatch" style="background:${t.swatch}"></span><strong>${esc(t.title)}</strong><small>${esc(t.detail)}</small><span class="theme-selected">${state.config.theme===t.id?'Current theme':'Use theme'}</span></button>`).join('')}</div>`;
