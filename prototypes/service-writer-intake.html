<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneShop | Intake to Storage Prototype</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1a293a;background:#f4f6f8;--ink:#23374a;--muted:#6d7e8c;--border:#dce3e9;--navy:#162a3a;--blue:#226c9c;--soft:#eaf2f7;--green:#1c745d;--warn:#a36c19}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}.app{display:grid;grid-template-columns:222px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#ccd7e1;padding:24px 14px}.brand{font-size:22px;letter-spacing:-.6px;font-weight:750;color:white;padding:0 12px 18px}.brand span{color:#77b5dc}.side-label{padding:18px 13px 8px;text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800;opacity:.53}.nav-btn{width:100%;color:#d6e0e8;border:0;text-align:left;background:transparent;padding:12px 13px;border-radius:8px;margin:2px 0;font-weight:600;font-size:13px}.nav-btn.active,.nav-btn:hover{background:#284358;color:white}.aside-note{margin:40px 10px 0;border:1px solid #3a5669;color:#b8cad5;border-radius:10px;padding:12px;line-height:1.5;font-size:11px}.main{min-width:0}.topbar{height:66px;background:white;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 34px}.crumb{font-size:12px;color:#688091}.topbar b{color:#223a4b}.pilot{font-size:11px;background:#fff7e5;color:#835b19;border:1px solid #efd8a8;padding:7px 10px;border-radius:6px;font-weight:700}.content{max-width:1240px;margin:0 auto;padding:32px 34px 80px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#6d889c;font-weight:800;text-transform:uppercase;margin-bottom:7px}h1{font-size:27px;letter-spacing:-.7px;margin:0 0 9px}h2{font-size:19px;letter-spacing:-.4px;margin:0 0 7px}h3{font-size:14px;margin:0 0 10px}.subtitle{font-size:13px;color:var(--muted);margin-bottom:25px;max-width:750px;line-height:1.6}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:23px;box-shadow:0 3px 18px #1c314407}.card+.card{margin-top:16px}.card-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.small{font-size:11px}.steps{display:flex;align-items:center;gap:8px;margin:0 0 20px}.step{flex:1;display:flex;gap:9px;align-items:center;border-bottom:3px solid #dfe7ec;padding:12px 3px;color:#8b9aa6;font-size:12px;font-weight:700}.step span{width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#e8eef2}.step.active{color:#276f9c;border-color:#276f9c}.step.active span{background:#dceefa}.step.done{color:#34765e;border-color:#75b29b}.step.done span{background:#dcf2e8}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd7df;border-radius:7px;padding:11px 12px;color:#20364a;background:white;font-size:13px;min-height:42px}.field textarea{min-height:85px;resize:vertical}.hint{margin:6px 0 0;font-size:11px;color:#83939f;line-height:1.4}.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:21px}.seg button{text-align:left;border:1px solid #d9e2e8;background:#fff;border-radius:10px;padding:16px}.seg button.selected{border-color:#407c9b;background:#edf6fb;box-shadow:inset 0 0 0 1px #407c9b}.seg strong{display:block;font-size:13px;margin-bottom:6px}.seg span{display:block;font-size:11px;color:#758594;line-height:1.5}.btn{padding:11px 16px;border-radius:7px;background:white;color:#284357;border:1px solid #bacbd6;font-size:12px;font-weight:750}.btn.primary{background:#1b638f;color:white;border-color:#1b638f}.btn.secondary{background:#eaf2f7;color:#225c80;border-color:#cbdde9}.btn.danger{color:#99531b;border-color:#e9caaa}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:18px;border-top:1px solid #e7edf1;gap:12px}.right{display:flex;gap:8px}.callout{border-left:3px solid #3183b8;background:#eef6fb;padding:14px 16px;border-radius:0 7px 7px 0;font-size:12px;line-height:1.6;margin:8px 0 20px}.callout strong{display:block;color:#20587b}.callout.warning{background:#fffaee;border-color:#b9872c}.two-col{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:18px}.flag{border-radius:15px;padding:5px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;background:#e9f3e9;color:#2c7a53;display:inline-block}.flag.pending{background:#fff5db;color:#92631a}.flag.blue{background:#e5f2fa;color:#1b689c}.stat{padding:13px;background:#f4f7f9;border:1px solid #e1e8ed;border-radius:7px}.stat span{display:block;font-size:11px;color:#8797a3}.stat strong{font-size:14px;color:#263d4e}.ro-row{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid #edf1f4}.line{background:#f8fafb;padding:11px 12px;margin-top:8px;border-left:2px solid #c8dae5;border-radius:4px;font-size:12px}.list{margin:0;padding:0;list-style:none}.list li{padding:12px 0;border-bottom:1px solid #e9eff2;font-size:12px}.timeline{position:relative;padding:6px 0 6px 22px;margin-left:9px;border-left:2px solid #d2e1ea}.timeline-card{position:relative;margin:10px 0 23px;border:1px solid #dbe5eb;border-radius:9px;padding:15px 18px}.timeline-card:before{position:absolute;content:"";left:-29px;top:19px;width:12px;height:12px;border:3px solid white;background:#2d719a;border-radius:50%;box-shadow:0 0 0 2px #a7c9dc}.timeline-card.future:before{background:#c48a2c;box-shadow:0 0 0 2px #e9cf9d}.timeline-header{display:flex;align-items:center;justify-content:space-between;gap:15px}.timeline-title{font-weight:750;font-size:13px}.event{display:flex;gap:10px;border-top:1px solid #e8eef2;padding:10px 0;font-size:12px}.event time{width:86px;flex:0 0 86px;color:#8294a3}.event b{font-weight:750}.event .muted{margin-top:3px}.timeline-inner{margin-top:13px;padding-top:5px;border-top:1px solid #e8eef2}.pill{padding:5px 8px;border:1px solid #d8e5ec;border-radius:16px;font-size:10px;font-weight:750;color:#547185;background:#f8fbfd}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}.kpi .card{padding:15px}.kpi strong{display:block;font-size:21px}.kpi span{font-size:11px;color:#8293a2}.message{padding:12px 14px;background:#ecf7f1;border:1px solid #c9e5d2;color:#2c7352;border-radius:7px;font-size:12px;margin:0 0 16px}.error{padding:12px 14px;background:#fff1ed;border:1px solid #f0c5b7;color:#9a3a24;border-radius:7px;font-size:12px;margin:0 0 16px}.queue-card{border:1px solid #dae5ec;border-radius:10px;padding:16px;margin-bottom:14px}.queue-top{display:flex;align-items:center;justify-content:space-between;gap:14px}.queue-card h3{margin:7px 0 6px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.empty{padding:40px 24px;text-align:center;border:1px dashed #cad8e2;border-radius:9px;color:#718596;font-size:13px;line-height:1.6}.unitcard{display:flex;justify-content:space-between;gap:14px;padding:14px;border:1px solid #dfe8ed;border-radius:9px;margin-bottom:10px}.tagline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.divider{height:1px;background:#e7edf2;margin:14px 0}.hide{display:none!important}.inline{display:flex;gap:10px;align-items:center}.backlink{color:#276f9c;border:0;background:none;padding:0;font-size:12px;font-weight:750}.badge-outline{background:#f0f5f8;border:1px solid #d7e4ec;border-radius:16px;color:#46647b;padding:5px 10px;font-size:11px}.subtitle strong{color:#344a5c}@media(max-width:1030px){.app{grid-template-columns:65px 1fr}.brand{font-size:19px;padding-left:0}.brand span{display:none}.nav-btn{font-size:0}.nav-btn:before{content:attr(data-icon);font-size:18px}.side-label,.aside-note{display:none}.sidebar{padding:18px 8px}.content{padding:25px 20px}.topbar{padding:0 20px}}@media(max-width:730px){.grid2,.grid3,.two-col,.seg,.kpi{grid-template-columns:1fr}.steps{flex-wrap:wrap}.step{min-width:46%;font-size:11px}.content{padding:22px 13px}.topbar{height:58px;padding:0 13px}.card{padding:16px}.card-head{display:block}.timeline{padding-left:16px}.timeline-header{align-items:flex-start}.pilot{font-size:9px}.actions{flex-direction:column-reverse;align-items:stretch}.right{width:100%}.right .btn{flex:1}.event time{width:66px;flex-basis:66px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand">ONE<span>SHOP</span></div><div class="side-label">Operations</div><button class="nav-btn active" data-icon="▣" data-page="checkin">Service Writer · Intake</button><button class="nav-btn" data-icon="↔" data-page="porter">Porter Queue</button><button class="nav-btn" data-icon="◷" data-page="customer">Customer Timeline</button><div class="side-label">Configuration</div><button class="nav-btn" data-icon="▦" data-page="map">Space Types / Map</button><div class="aside-note"><b>Prototype</b><br>Click through check-in, request a type-based move, claim and confirm it, and inspect the customer's resulting timeline. All data is local to this page.</div></aside><div class="main"><header class="topbar"><div class="crumb">OneShop <b> / <span id="breadcrumb">Service Writer · Intake</span></b></div><span class="pilot">WORKFLOW PROTOTYPE · NOT CONNECTED</span></header><main class="content" id="root"></main></div></div>
<script>
'use strict';
const types=[{id:'dropoff',name:'Customer Drop-off',prefix:'DO',spaces:['DO-01','DO-02'],area:true,capacity:8},{id:'storage',name:'Service Storage',prefix:'SS',spaces:['SS-01','SS-02','SS-03','SS-04'],capacity:1},{id:'bay',name:'Service Bay',prefix:'SB',spaces:['SB-01','SB-02','SB-03'],capacity:1},{id:'wash',name:'Wash Bay',prefix:'WB',spaces:['WB-01','WB-02'],capacity:1},{id:'detail',name:'Detail Bay',prefix:'DB',spaces:['DB-01'],capacity:1},{id:'pdi',name:'PDI Staging',prefix:'PDI',spaces:['PDI-01','PDI-02'],capacity:1},{id:'waiter',name:'Waiter Way',prefix:'WW',spaces:['WW-01','WW-02'],capacity:1}];
const now=()=>new Date().toISOString(); const short=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); const tm=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'checkin',step:0,done:false,notice:'',error:'',checkinType:'customer',customer:{name:'Jordan Ellis',phone:'(707) 555-0169',email:'jordan@example.com'},unit:{kind:'RV',year:'2022',make:'Grand Design',model:'Reflection 311BHS',vin:'573FR3827N9924101',stock:''},ro:'RO-10482',scope:'Investigate freshwater pump noise and intermittent low pressure',extraLines:[],extraROs:[],advisor:'Avery Chen',notes:'',arrival:'DO-01',keyStatus:'Cabinet intake',urgency:'routine',promised:'',location:'DO-01',move:{pickup:'DO-01',type:'storage',space:'',priority:'normal',note:''},requests:[],eventLog:[],visitId:'',expanded:true,filter:'90',unitFilter:'all'};
const save=(key,value)=>{state[key]=value;state.error=''};
const root=document.getElementById('root');
function nav(page){state.page=page;state.notice='';state.error='';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('breadcrumb').textContent={checkin:'Service Writer · Intake',porter:'Porter Queue',customer:'Customer Timeline',map:'Location Configuration'}[page];render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function setField(path,v){let [a,b]=path.split('.');if(b)state[a][b]=v;else state[a]=v;state.error=''}
function field(path,label,opts={}){const parts=path.split('.');let value=parts.length===2?state[parts[0]][parts[1]]:state[path];let attrs=`data-bind="${esc(path)}"`;let input=opts.options?`<select ${attrs}>${opts.options.map(o=>`<option value="${esc(o[0])}" ${value===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:opts.long?`<textarea ${attrs} placeholder="${esc(opts.placeholder||'')}">${esc(value)}</textarea>`:`<input ${attrs} type="${opts.type||'text'}" value="${esc(value)}" placeholder="${esc(opts.placeholder||'')}">`;return `<div class="field"><label>${esc(label)} ${opts.required?'<span style="color:#ae6136">*</span>':''}</label>${input}${opts.hint?`<p class="hint">${esc(opts.hint)}</p>`:''}</div>`}
function bind(){root.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('input',e=>{setField(el.dataset.bind,e.target.value);if(el.dataset.bind==='move.type')render()}));root.querySelectorAll('[data-extra-line]').forEach(el=>el.addEventListener('input',e=>state.extraLines[+el.dataset.extraLine]=e.target.value));root.querySelectorAll('[data-extra-ro-number]').forEach(el=>el.addEventListener('input',e=>state.extraROs[+el.dataset.extraRoNumber].number=e.target.value));root.querySelectorAll('[data-extra-ro-scope]').forEach(el=>el.addEventListener('input',e=>state.extraROs[+el.dataset.extraRoScope].scope=e.target.value))}
function msg(){return (state.error?`<div class="error">${esc(state.error)}</div>`:'')+(state.notice?`<div class="message">${esc(state.notice)}</div>`:'')}
function title(kicker,heading,description){return `<div class="eyebrow">${esc(kicker)}</div><h1>${esc(heading)}</h1><p class="subtitle">${description}</p>`}
function stages(){let names=['Routing','Customer & unit','Repair orders','Receipt'];return `<div class="steps">${names.map((n,i)=>`<div class="step ${i===state.step?'active':i<state.step?'done':''}"><span>${i<state.step?'✓':i+1}</span>${n}</div>`).join('')}</div>`}
function checkin(){if(state.done){postCheckin();return}let content='';
if(state.step===0)content=`<h2>What type of unit is being received?</h2><p class="subtitle">The intake classification determines the recommended processing flow. It does not change the core Customer → Unit → RO → Line Item record structure.</p><div class="seg"><button class="${state.checkinType==='customer'?'selected':''}" data-type="customer"><strong>Customer Unit · Service</strong><span>Repair, diagnosis, warranty or customer service. Usually routed to Service Storage after receipt.</span></button><button class="${state.checkinType==='inventory'?'selected':''}" data-type="inventory"><strong>New Unit · Inventory</strong><span>New dealership inventory, receiving or PDI. Usually routed to PDI Staging.</span></button></div><div class="grid2">${field('urgency','Processing priority',{options:[['routine','Routine processing'],['waiter','Waiter / express'],['restricted','Non-drivable / special handling']]})}<div class="callout"><strong>System recommendation</strong>${esc(state.urgency==='waiter'?'Move to Waiter Way':state.checkinType==='inventory'?'Stage for PDI':'Move to Service Storage')} is suggested after check-in. The service writer is not expected to choose an individual numbered parking space.</div></div>`;
if(state.step===1)content=`<h2>Identify the customer and unit</h2><p class="subtitle">Minimal information first. Optional fields should not delay check-in. Search and matching rules will be implemented against the real dealership records.</p><div class="grid2"><div><h3>Customer / responsible account</h3>${field('customer.name','Customer / account name',{required:true})}${field('customer.phone','Primary phone',{hint:'Multiple phone contacts and preferences are supported in the production data model.'})}${field('customer.email','Email address',{type:'email',hint:'Optional. Additional emails belong to contact records.'})}</div><div><h3>Unit (RV or vehicle)</h3>${field('unit.kind','Type',{options:[['RV','RV / travel trailer / motorhome'],['Vehicle','Other vehicle']]})}<div class="grid2">${field('unit.year','Year')}${field('unit.make','Make')}</div>${field('unit.model','Model')}${field('unit.vin','VIN / serial identifier',{required:true})}${field('unit.stock','Stock number (optional)')}</div></div>`;
if(state.step===2)content=`<h2>Associate repair orders and work</h2><p class="subtitle">One unit can have several concurrent repair orders, each with its own service line items. Add as many as needed at intake.</p><div class="grid2">${field('ro','Repair order number',{required:true})}${field('advisor','Responsible service writer',{required:true})}</div>${field('scope','RO 1 · Line item 01',{long:true,required:true,placeholder:'Customer concern or receiving work scope'})}${state.extraLines.map((v,i)=>`<div class="field"><label>RO 1 · Line item ${String(i+2).padStart(2,'0')}</label><input data-extra-line="${i}" value="${esc(v)}" placeholder="Additional work or customer concern"></div>`).join('')}<button class="btn" id="addline" type="button">+ Add line item</button><div class="divider"></div>${state.extraROs.map((r,i)=>`<div class="grid2"><div class="field"><label>RO ${i+2} · Number</label><input data-extra-ro-number="${i}" value="${esc(r.number)}" placeholder="RO number"></div><div class="field"><label>RO ${i+2} · Line item 01</label><input data-extra-ro-scope="${i}" value="${esc(r.scope)}" placeholder="Work scope"></div></div>`).join('')}<button class="btn secondary" id="addro" type="button">+ Add another RO</button><div class="callout"><strong>Hierarchy</strong>${esc(state.customer.name||'Customer')} → ${esc(state.unit.make+' '+state.unit.model)} → ${1+state.extraROs.length} RO(s) → ${1+state.extraLines.length+state.extraROs.length} line item(s). All share this physical unit and visit.</div>`;
if(state.step===3)content=`<h2>Confirm physical receipt</h2><p class="subtitle">Record where the unit actually is and whether it can safely be moved. The arrival area is not the final parking assignment.</p><div class="grid2">${field('arrival','Receiving / pickup location',{options:types.find(t=>t.id==='dropoff').spaces.map(x=>[x,x])})}${field('keyStatus','Key / packet status',{options:[['Cabinet intake','Keys checked in at service desk'],['With unit','Keys / packet with unit'],['Missing / unresolved','Missing keys or custody unresolved']]})}${field('promised','Customer pickup commitment (if agreed)',{type:'datetime-local',hint:'Optional. Never invent a promise or copy a shop estimate into a customer commitment.'})}${field('notes','Receipt notes / visible condition',{long:true,placeholder:'Existing damage, handling restrictions, photos to be added'})}</div><div class="callout warning"><strong>Next action after finishing</strong>The visit is recorded as checked in. A Move Unit action will be offered. A move request never changes the unit's confirmed physical location until the porter confirms delivery.</div>`;
root.innerHTML=title('Workflow 01 / Unit arrival','Service Writer Check-In','Receive the customer, identify the unit and its work, confirm physical arrival, and route it to the next operational department.')+msg()+`<div class="card">${stages()}${content}<div class="actions"><button class="btn" id="back" ${state.step===0?'disabled':''}>Back</button><div class="right"><button class="btn secondary" id="next">${state.step===3?'Finish Check-In':'Continue'}</button></div></div></div>`;bind();root.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{state.checkinType=b.dataset.type;render()}));if(state.step===2){root.querySelector('#addline').onclick=()=>{state.extraLines.push('');render()};root.querySelector('#addro').onclick=()=>{state.extraROs.push({number:'',scope:''});render()}}root.querySelector('#back').onclick=()=>{if(state.step>0)state.step--;render()};root.querySelector('#next').onclick=()=>{if(!validateStep())return;if(state.step===3)finish();else {state.step++;render()}}}
function validateStep(){if(state.step===1&&(!state.customer.name.trim()||!state.unit.vin.trim()&&!state.unit.stock.trim())){state.error='Enter a customer/account and a unit identifier (VIN, serial or stock number).';render();return false}if(state.step===2&&(!state.ro.trim()||!state.scope.trim()||!state.advisor.trim()||state.extraLines.some(x=>!x.trim())||state.extraROs.some(x=>!x.number.trim()||!x.scope.trim())||new Set([state.ro,...state.extraROs.map(x=>x.number.trim())]).size!==1+state.extraROs.length)){state.error='Provide distinct RO numbers, responsible writer and descriptions for every line item.';render();return false}return true}
function event(type,label,details){state.eventLog.push({id:'e'+(state.eventLog.length+1),type,label,details,at:now(),visit:state.visitId,unit:state.unit.vin})}
function finish(){if(state.done)return;state.done=true;state.visitId='V-2026-001';state.location=state.arrival;state.move.pickup=state.location;state.move.type=state.urgency==='waiter'?'waiter':state.checkinType==='inventory'?'pdi':'storage';state.move.space='';event('checkin','Service Writer Check-In',`${state.customer.name} · ${[state.ro,...state.extraROs.map(x=>x.number)].join(', ')} · ${state.arrival}`);state.notice='Check-in recorded in the prototype. Recommended next action: Move Unit.';render()}
function postCheckin(){const t=types.find(x=>x.id===state.move.type);let queued=state.requests.find(r=>r.status!=='delivered'&&r.status!=='canceled');root.innerHTML=title('Workflow 01 / Next action','Check-In Complete','The unit has been received. Select its next destination by area or space type; specific space allocation is optional.')+msg()+`<div class="kpi"><div class="card"><span>Customer</span><strong>${esc(state.customer.name)}</strong></div><div class="card"><span>Unit / VIN ending</span><strong>${esc(state.unit.vin.slice(-6))}</strong></div><div class="card"><span>Confirmed position</span><strong>${esc(state.location)}</strong></div></div><div class="two-col"><section class="card"><div class="card-head"><div><h2>Move Unit</h2><p class="muted">System recommendation: ${esc(state.urgency==='waiter'?'Waiter Way':state.checkinType==='inventory'?'PDI Staging':'Service Storage')}</p></div><span class="flag blue">Next action</span></div>${queued?`<div class="callout warning"><strong>Move already in progress</strong>${esc(queued.id)} is ${esc(queued.status)}. Open Porter Queue to progress it.</div>`:''}<div class="grid2">${field('move.pickup','Pickup location',{options:[state.location,state.arrival,...types.flatMap(x=>x.spaces)].filter((x,i,a)=>a.indexOf(x)===i).map(x=>[x,x])})}${field('move.type','Destination space / area type',{options:types.filter(x=>x.id!=='dropoff').map(x=>[x.id,x.name])})}</div>${field('move.space','Specific numbered space (optional)',{options:[['','No specific space · assign at dispatch'],...t.spaces.map(x=>[x,x])]})}<div class="grid2">${field('move.priority','Priority',{options:[['normal','Normal'],['urgent','Urgent']]})}${field('move.note','Porter instructions',{placeholder:'Handling, key bag, access notes'})}</div><div class="actions"><button class="btn" id="skip">Skip for now</button><div class="right"><button class="btn primary" id="request" ${queued||state.urgency==='restricted'||state.keyStatus==='Missing / unresolved'?'disabled':''}>${state.urgency==='restricted'||state.keyStatus==='Missing / unresolved'?'Supervisor review required':'Request Move'}</button></div></div></section><aside class="card"><h3>Check-In Summary</h3><ul class="list"><li><b>Processing:</b> ${esc(state.checkinType==='customer'?'Customer service':'New inventory / PDI')}</li><li><b>Received:</b> ${esc(short(now()))}</li><li><b>ROs:</b> ${esc([state.ro,...state.extraROs.map(x=>x.number)].join(', '))}</li><li><b>Work lines:</b> ${esc(1+state.extraLines.length+state.extraROs.length)} line(s)</li><li><b>Keys:</b> ${esc(state.keyStatus)}</li><li><b>Physical location:</b> ${esc(state.location)}</li></ul><div class="divider"></div><button class="btn secondary" id="open-customer">Open customer timeline</button></aside></div>`;bind();root.querySelector('#open-customer').onclick=()=>nav('customer');root.querySelector('#skip').onclick=()=>{state.notice='Move left pending; the unit remains at its confirmed pickup position.';render()};let req=root.querySelector('#request');req.onclick=()=>{if(state.move.space&&!t.spaces.includes(state.move.space)){state.error='Selected space no longer matches the selected destination type.';render();return}if(state.move.pickup!==state.location){state.error='Pickup location differs from confirmed location. A supervisor must first reconcile its actual position.';render();return}const r={id:`MOVE-${String(state.requests.length+1).padStart(3,'0')}`,status:'requested',from:state.location,type:state.move.type,to:state.move.space,priority:state.move.priority,note:state.move.note,claimedBy:'',created:now()};state.requests.push(r);event('move_requested','Movement requested',`${r.from} → ${t.name}${r.to?' / '+r.to:''}`);state.notice='Movement request placed in Porter Queue. Actual unit position has not changed.';render()}}
function porter(){let active=state.requests.filter(r=>r.status!=='delivered'&&r.status!=='canceled');root.innerHTML=title('Workflow 02 / Physical movements','Porter Queue','Porters claim a move, locate the unit, resolve the final parking position when required and confirm actual delivery.')+msg()+`<div class="kpi"><div class="card"><span>Awaiting claim</span><strong>${active.filter(r=>r.status==='requested').length}</strong></div><div class="card"><span>In progress</span><strong>${active.filter(r=>r.status==='claimed'||r.status==='picked_up').length}</strong></div><div class="card"><span>Unit location</span><strong>${esc(state.location)}</strong></div></div><div class="card"><h2>Movement assignments</h2><p class="subtitle">Only a confirmed delivery updates the customer and dealership map. A type-only request is a valid assignment.</p>${state.requests.length?state.requests.map(r=>`<div class="queue-card"><div class="queue-top"><div class="tagline"><b>${esc(r.id)}</b><span class="flag ${r.status==='delivered'?'':'pending'}">${esc(r.status.replace('_',' '))}</span></div><span class="pill">${esc(r.priority.toUpperCase())}</span></div><h3>${esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)} · ${esc(state.unit.vin.slice(-6))}</h3><div class="chips"><span class="badge-outline">From ${esc(r.from)}</span><span class="badge-outline">Destination ${esc(types.find(t=>t.id===r.type).name)}</span><span class="badge-outline">${esc(r.to||'Exact space not specified')}</span></div><p class="muted">${esc(state.customer.name)} · ${esc(state.ro)} · Keys: ${esc(state.keyStatus)} ${r.note?'· '+esc(r.note):''}</p>${r.status==='requested'?`<button class="btn primary" data-claim="${r.id}">Claim Move</button>`:r.status==='claimed'?`<button class="btn primary" data-pickup="${r.id}">Confirm Pickup</button>`:r.status==='picked_up'?`<div class="field"><label>Final confirmed destination space</label><select data-arrival="${r.id}">${types.find(t=>t.id===r.type).spaces.map(s=>`<option ${r.to===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div><button class="btn primary" data-deliver="${r.id}">Confirm Delivery</button>`:`<span class="flag">Delivered at ${esc(r.to)}</span>`}</div>`).join(''):`<div class="empty">No movement requests yet.<br>Finish a service-writer check-in and select <b>Request Move</b> to populate this queue.</div>`}</div>`;
root.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{let r=state.requests.find(x=>x.id===b.dataset.claim);if(r.status!=='requested')return;r.status='claimed';r.claimedBy='Demo Porter';event('move_claimed','Porter claimed move',r.id+' · Demo Porter');state.notice='Claim recorded. In production this operation must be atomic so two porters cannot claim the same move.';render()});root.querySelectorAll('[data-pickup]').forEach(b=>b.onclick=()=>{let r=state.requests.find(x=>x.id===b.dataset.pickup);if(r.status!=='claimed')return;r.status='picked_up';event('move_picked_up','Unit picked up',`${r.id} · ${r.from}`);state.notice='Pickup confirmed; the last confirmed map location remains unchanged until delivery.';render()});root.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>{let r=state.requests.find(x=>x.id===b.dataset.deliver);if(r.status!=='picked_up')return;let selected=root.querySelector(`[data-arrival="${r.id}"]`).value;let occupied=state.requests.find(x=>x.id!==r.id&&x.status==='delivered'&&x.to===selected);if(occupied){state.error='Space already occupied in this demo. Choose a different destination.';render();return}r.to=selected;r.status='delivered';state.location=selected;state.move.pickup=selected;event('move_delivered','Moved to '+types.find(t=>t.id===r.type).name,`${r.from} → ${r.to} · Demo Porter`);state.notice='Physical location confirmed and timeline updated.';render()})}
function customer(){const cutoff=state.filter==='all'?-Infinity:Date.now()-Number(state.filter)*86400000;const events=state.eventLog.filter(e=>e.visit===state.visitId&&new Date(e.at).getTime()>=cutoff&&(state.unitFilter==='all'||e.unit===state.unit.vin));const hasVisit=state.done&&events.length>0;const expanded=state.expanded;root.innerHTML=title('Customer record / Primary view',state.customer.name,'The customer timeline is the first substantive component. Service visits stay grouped, and their detailed events expand beneath the main history.')+`<div class="card"><div class="card-head"><div><div class="eyebrow">Customer profile</div><div class="tagline"><span class="badge-outline">${esc(state.customer.phone||'No phone')}</span><span class="badge-outline">${esc(state.customer.email||'No email')}</span></div></div><button class="btn secondary" id="checkin-new">${hasVisit?'View current check-in':'Start check-in'}</button></div></div><div class="card"><div class="card-head"><div><h2>Customer Timeline</h2><p class="muted">Service visits, milestones, recommendations and future reminders.</p></div><span class="pill">Primary customer component</span></div><div class="grid2"><div class="field"><label>Time period</label><select id="period"><option value="30" ${state.filter==='30'?'selected':''}>Last 30 days</option><option value="90" ${state.filter==='90'?'selected':''}>Last 90 days</option><option value="365" ${state.filter==='365'?'selected':''}>Last 12 months</option><option value="all" ${state.filter==='all'?'selected':''}>All time</option></select></div><div class="field"><label>Unit</label><select id="unitselect"><option value="all">All customer units</option><option value="current" ${state.unitFilter==='current'?'selected':''}>${esc(state.unit.make+' '+state.unit.model+' · '+state.unit.vin.slice(-6))}</option></select></div></div><div class="timeline"><div class="timeline-card future"><div class="timeline-header"><div><div class="timeline-title">Future follow-up / recommendation</div><span class="muted">Scheduled · Example only</span></div><span class="flag pending">Future</span></div><p class="muted">Recommended service and advisor follow-ups appear here as future items, not as work already performed.</p></div>${hasVisit?`<div class="timeline-card"><div class="timeline-header"><div><div class="timeline-title">Service Visit · ${esc(short(events[0].at))}</div><p class="muted">${esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)} · ${esc([state.ro,...state.extraROs.map(x=>x.number)].join(', '))} · Current: ${esc(state.location)}</p></div><button class="btn secondary" id="expand">${expanded?'Hide details':'Expand visit'}</button></div>${expanded?`<div class="timeline-inner">${events.map(e=>`<div class="event"><time>${esc(tm(e.at))}</time><div><b>${esc(e.label)}</b><div class="muted">${esc(e.details)}</div></div></div>`).join('')}</div>`:''}</div>`:`<div class="empty">No recorded service visit in this prototype.<br>Complete check-in to see its timeline group and expandable milestones.</div>`}</div></div><div class="card"><div class="card-head"><div><h2>Customer Units</h2><p class="muted">Each unit has a dedicated history, even if its owner changes later.</p></div><span class="pill">1 unit in demo</span></div><div class="unitcard"><div><b>${esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)}</b><p class="muted">${esc(state.unit.kind)} · VIN ${esc(state.unit.vin)} · ${hasVisit?'On site at '+state.location:'No active visit recorded'}</p></div><button class="btn" id="history">View history</button></div></div>`;root.querySelector('#checkin-new').onclick=()=>nav('checkin');root.querySelector('#history').onclick=()=>{state.expanded=true;render();window.scrollTo({top:0,behavior:'smooth'})};root.querySelector('#period').onchange=e=>{state.filter=e.target.value;render()};root.querySelector('#unitselect').onchange=e=>{state.unitFilter=e.target.value;render()};if(root.querySelector('#expand'))root.querySelector('#expand').onclick=()=>{state.expanded=!state.expanded;render()}}
function map(){root.innerHTML=title('Property setup / Future module','Location Type & Map Builder','The complete map editor is a dedicated later build. This prototype uses the same destination-type contract without fabricating a map or availability system.')+`<div class="callout warning"><strong>Advanced editor intentionally not simulated</strong>Production will support map image upload, zoom/pan, arrays, rotation, shaded multi-unit areas, numbered-space templates, published revisions, accurate capacity and concurrent editing.</div><div class="card"><div class="card-head"><div><h2>Location type registry</h2><p class="muted">Every numbered space requires a type and receives a code built from its configured abbreviation and number.</p></div><span class="flag pending">Fixture only</span></div>${types.map(t=>`<div class="ro-row"><div><b>${esc(t.name)}</b><p class="muted">Prefix: ${esc(t.prefix)} · ${t.area?'Shared arrival area':'Individual positions'} · ${t.spaces.length} example positions</p></div><span class="badge-outline">${esc(t.spaces.slice(0,2).join(', '))}</span></div>`).join('')}</div><div class="card"><h2>Location selection rule</h2><div class="callout"><strong>Type required · Exact space optional</strong>Service writers request a move to Service Storage or another operational type. Porters/foremen choose a permissible exact destination based on the site's allocation policy, and only their confirmed delivery updates occupancy.</div></div>`}
function render(){window.scrollTo({top:0,behavior:'auto'});({checkin,porter,customer,map})[state.page]();}
render();
</script></body></html>
