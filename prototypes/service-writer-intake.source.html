<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>OneShop | Intake to Storage Prototype</title>
<link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/oneshop.css"></head>
<body><div class="app"><aside class="sidebar"><div class="brand">ONE<span>SHOP</span></div><div class="side-label">Operations</div><button class="nav-btn active" data-icon="▣" data-page="checkin">Service Writer · Intake</button><button class="nav-btn" data-icon="↔" data-page="porter">Porter Queue</button><button class="nav-btn" data-icon="◉" data-page="inbox">Notifications <span class="badge-outline" id="inbox-count">0</span></button><button class="nav-btn" data-icon="◷" data-page="customer">Customer Timeline</button><div class="side-label">Configuration</div><button class="nav-btn" data-icon="▦" data-page="map">Space Types / Map</button><button class="nav-btn" data-icon="⚙" data-page="settings">Settings</button><div class="aside-note"><b>Prototype</b><br>Click through check-in, request a type-based move, claim and confirm it, and inspect the customer's resulting timeline. All data is local to this page.</div></aside><div class="main"><header class="topbar"><div class="crumb">OneShop <b> / <span id="breadcrumb">Service Writer · Intake</span></b></div><span class="pilot">WORKFLOW PROTOTYPE · NOT CONNECTED</span></header><main class="content" id="root"></main></div></div>
<script>
'use strict';
const types=[{id:'dropoff',name:'Customer Drop-off',prefix:'DO',spaces:['DO-01','DO-02'],area:true,capacity:8},{id:'storage',name:'Service Storage',prefix:'SS',spaces:['SS-01','SS-02','SS-03','SS-04'],capacity:1},{id:'bay',name:'Service Bay',prefix:'SB',spaces:['SB-01','SB-02','SB-03'],capacity:1},{id:'wash',name:'Wash Bay',prefix:'WB',spaces:['WB-01','WB-02'],capacity:1},{id:'detail',name:'Detail Bay',prefix:'DB',spaces:['DB-01'],capacity:1},{id:'pdi',name:'PDI Staging',prefix:'PDI',spaces:['PDI-01','PDI-02'],capacity:1},{id:'waiter',name:'Waiter Way',prefix:'WW',spaces:['WW-01','WW-02'],capacity:1}];
// Settings are demonstration-only: persisted in this browser, not to an organization database.
const SETTINGS_KEY='oneshop.prototype.shop-settings.v3';
const configurableFields=[
 {group:'Customer & contact',path:'customer.name',title:'Customer / account name',help:'An unassigned customer is permitted until the correct account is linked.'},
 {group:'Customer & contact',path:'customer.phone',title:'Primary phone',help:'Do not block inventory receiving if there is no customer phone.'},
 {group:'Customer & contact',path:'customer.email',title:'Email address',help:'A customer can have multiple contact methods in the production model.'},
 {group:'Unit identification',path:'unit.vin',title:'VIN / serial identifier',help:'Either VIN or stock number must identify the unit at check-in.'},
 {group:'Unit identification',path:'unit.stock',title:'Stock number',help:'Can replace required VIN for dealerships using stock-number workflows.'},
 {group:'Unit information',path:'unit.year',title:'Year',help:'Can be completed later if unavailable at arrival.'},
 {group:'Unit information',path:'unit.make',title:'Make',help:'Reuses saved unit details when selected from search.'},
 {group:'Unit information',path:'unit.model',title:'Model',help:'Reuses saved unit details when selected from search.'},
 {group:'Repair order',path:'ro',title:'RO number',help:'An unnamed draft RO may be linked to the visit and numbered later.'},
 {group:'Repair order',path:'scope',title:'Initial line-item description',help:'A line can remain pending when the specific work is not yet known.'},
 {group:'Repair order',path:'advisor',title:'Responsible service writer',help:'An unassigned queue must retain responsibility until assignment.'},
 {group:'Receipt',path:'keyStatus',title:'Keys / packet custody',help:'Unknown or missing keys must be flagged before a move.'},
 {group:'Receipt',path:'promised',title:'Customer pickup commitment',help:'Do not invent a customer promise.'},
 {group:'Receipt',path:'notes',title:'Condition / receipt notes',help:'Optional condition or handling remarks.'}
];
const defaultRules={
 customer:{'customer.name':'required','customer.phone':'optional','customer.email':'optional','unit.vin':'required','unit.stock':'optional','unit.year':'optional','unit.make':'optional','unit.model':'optional',ro:'required',scope:'required',advisor:'required',keyStatus:'required',promised:'optional',notes:'optional'},
 inventory:{'customer.name':'optional','customer.phone':'hidden','customer.email':'hidden','unit.vin':'optional','unit.stock':'required','unit.year':'optional','unit.make':'optional','unit.model':'optional',ro:'optional',scope:'optional',advisor:'required',keyStatus:'required',promised:'hidden',notes:'optional'}
};
const themes=[{id:'classic',title:'Classic blue',detail:'Approved OneShop baseline',swatch:'#0c5f91'},{id:'slate',title:'Graphite',detail:'Neutral operational theme',swatch:'#475569'},{id:'forest',title:'Forest',detail:'Muted green accent',swatch:'#216b53'}];
const copy=v=>JSON.parse(JSON.stringify(v));
function loadSettings(){let saved={};try{saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')||{}}catch(e){}const merged={theme:themes.some(t=>t.id===saved.theme)?saved.theme:'classic',profiles:copy(defaultRules)};for(const p of ['customer','inventory']){for(const f of configurableFields){const x=saved.profiles?.[p]?.[f.path];if(['required','optional','hidden'].includes(x))merged.profiles[p][f.path]=x;}}return merged;}
function persistSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(state.config));return true}catch(e){state.error='Browser storage unavailable: your settings are active for this session only.';return false}}
function setTheme(v){state.config.theme=v;document.documentElement.dataset.theme=v;persistSettings();state.notice='Appearance saved for this prototype. All views use the same theme tokens.';state.error='';render()}
function requiredMode(path,opts={}){if(!configurableFields.some(f=>f.path===path))return opts.required?'required':'optional';return state.config.profiles[state.checkinType][path]||'optional'}
const demoDirectory=[{id:'C-001',unitId:'U-002',name:'Jordan Ellis',phone:'(707) 555-0169',email:'jordan@example.com',kind:'RV',year:'2022',make:'Grand Design',model:'Reflection 311BHS',vin:'573FR3827N9924101',stock:'',ro:'RO-10482',scope:'Investigate freshwater pump noise and intermittent low pressure'},
 {id:'C-014',unitId:'U-047',name:'Summit Auto Group',phone:'(707) 555-0140',email:'receiving@example.com',kind:'RV',year:'2025',make:'Airstream',model:'Flying Cloud',vin:'',stock:'INV-0472',ro:'',scope:''}];
function unitIdentifier(){return state.unit.vin?.trim()||state.unit.stock?.trim()||'Unit identifier pending'}
function accountLabel(){return state.customer.name?.trim()||'Unassigned customer / internal account'}
function roLabel(){return state.ro?.trim()||'Draft RO · number pending'}
function showRule(path){return requiredMode(path)!=='hidden'}
const now=()=>new Date().toISOString(); const short=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); const tm=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'checkin',step:0,done:false,notice:'',error:'',checkinType:'customer',customer:{name:'Jordan Ellis',phone:'(707) 555-0169',email:'jordan@example.com'},unit:{kind:'RV',year:'2022',make:'Grand Design',model:'Reflection 311BHS',vin:'573FR3827N9924101',stock:''},ro:'RO-10482',scope:'Investigate freshwater pump noise and intermittent low pressure',extraLines:[],extraROs:[],advisor:'Avery Chen',notes:'',arrival:'DO-01',keyStatus:'Cabinet intake',urgency:'routine',promised:'',location:'DO-01',move:{pickup:'DO-01',type:'storage',space:'',priority:'normal',receiver:'foreman',note:''},requests:[],eventLog:[],notifications:[],viewerRole:'service_writer',openNotice:'',visitId:'',expanded:true,filter:'90',unitFilter:'all',config:loadSettings(),settingsProfile:'customer',settingsTab:'fields',lookupQuery:'',matchedRecord:''};
const save=(key,value)=>{state[key]=value;state.error=''};
const root=document.getElementById('root');
function nav(page){state.page=page;state.notice='';state.error='';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('breadcrumb').textContent={checkin:'Service Writer · Intake',porter:'Porter Queue',inbox:'Notifications',customer:'Customer Timeline',map:'Location Configuration',settings:'Dealership Settings'}[page];render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function setField(path,v){let [a,b]=path.split('.');if(b)state[a][b]=v;else state[a]=v;state.error=''}
function field(path,label,opts={}){const mode=requiredMode(path,opts);if(mode==='hidden')return '';const parts=path.split('.');let value=parts.length===2?state[parts[0]][parts[1]]:state[path];let attrs=`data-bind="${esc(path)}" ${mode==='required'?'required aria-required="true"':''}`;let input=opts.options?`<select ${attrs}>${opts.options.map(o=>`<option value="${esc(o[0])}" ${value===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:opts.long?`<textarea ${attrs} placeholder="${esc(opts.placeholder||'')}">${esc(value)}</textarea>`:`<input ${attrs} type="${opts.type||'text'}" value="${esc(value)}" placeholder="${esc(opts.placeholder||'')}">`;return `<div class="field"><label>${esc(label)} ${mode==='required'?'<span class="required-mark" aria-label="required">*</span>':'<span class="optional-mark">Optional</span>'}</label>${input}${opts.hint?`<p class="hint">${esc(opts.hint)}</p>`:''}</div>`}
function bind(){root.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('input',e=>{setField(el.dataset.bind,e.target.value);if(el.dataset.bind==='move.type')render()}));root.querySelectorAll('[data-extra-line]').forEach(el=>el.addEventListener('input',e=>state.extraLines[+el.dataset.extraLine]=e.target.value));root.querySelectorAll('[data-extra-ro-number]').forEach(el=>el.addEventListener('input',e=>state.extraROs[+el.dataset.extraRoNumber].number=e.target.value));root.querySelectorAll('[data-extra-ro-scope]').forEach(el=>el.addEventListener('input',e=>state.extraROs[+el.dataset.extraRoScope].scope=e.target.value))}
function msg(){return (state.error?`<div class="error">${esc(state.error)}</div>`:'')+(state.notice?`<div class="message">${esc(state.notice)}</div>`:'')}
function title(kicker,heading,description){return `<div class="eyebrow">${esc(kicker)}</div><h1>${esc(heading)}</h1><p class="subtitle">${description}</p>`}
function stages(){let names=['Routing','Customer & unit','Repair orders','Receipt'];return `<div class="steps">${names.map((n,i)=>`<div class="step ${i===state.step?'active':i<state.step?'done':''}"><span>${i<state.step?'✓':i+1}</span>${n}</div>`).join('')}</div>`}
function checkin(){if(state.done){postCheckin();return}let content='';
if(state.step===0)content=`<h2>What type of unit is being received?</h2><p class="subtitle">The intake classification determines the recommended processing flow. It does not change the core Customer → Unit → RO → Line Item record structure.</p><div class="seg"><button class="${state.checkinType==='customer'?'selected':''}" data-type="customer"><strong>Customer Unit · Service</strong><span>Repair, diagnosis, warranty or customer service. Usually routed to Service Storage after receipt.</span></button><button class="${state.checkinType==='inventory'?'selected':''}" data-type="inventory"><strong>New Unit · Inventory</strong><span>New dealership inventory, receiving or PDI. Usually routed to PDI Staging.</span></button></div><div class="grid2">${field('urgency','Processing priority',{options:[['routine','Routine processing'],['waiter','Waiter / express'],['restricted','Non-drivable / special handling']]})}<div class="callout"><strong>System recommendation</strong>${esc(state.urgency==='waiter'?'Move to Waiter Way':state.checkinType==='inventory'?'Stage for PDI':'Move to Service Storage')} is suggested after check-in. The service writer is not expected to choose an individual numbered parking space.</div></div>`;
if(state.step===1)content=`<h2>Identify the customer and unit</h2><p class="subtitle">Look up existing records first. The shop's <b>${state.checkinType==='customer'?'Customer Service':'New Inventory'}</b> requirements decide which details are required, optional or hidden.</p><div class="lookup-panel"><div class="lookup-title"><strong>Find existing customer / unit</strong><span class="pill">Demo directory · no database</span></div><div class="lookup-controls"><input id="lookup" value="${esc(state.lookupQuery)}" placeholder="Search name, VIN, stock number or RO" aria-label="Search existing records"><button class="btn secondary" id="lookup-search">Search</button><button class="btn" id="clear-new">New record</button></div><div class="lookup-results">${demoDirectory.filter(x=>(x.name+' '+x.vin+' '+x.stock+' '+x.ro).toLowerCase().includes(state.lookupQuery.toLowerCase())).map(x=>`<div class="lookup-result"><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.year+' '+x.make+' '+x.model)} · ${esc(x.vin||x.stock)} · Customer ${esc(x.id)}, Unit ${esc(x.unitId)}</div></div><button class="btn" data-use-record="${esc(x.unitId)}">Use saved record</button></div>`).join('')||'<div class="muted">No matches in demonstration directory. Enter a new record below.</div>'}</div>${state.matchedRecord?`<div class="message">Existing unit ${esc(state.matchedRecord)} matched. Its identifiers will be reused, not recreated.</div>`:''}</div><div class="grid2"><div><h3>Customer / responsible account</h3>${field('customer.name','Customer / account name')}${field('customer.phone','Primary phone')}${field('customer.email','Email address',{type:'email'})}</div><div><h3>Unit (RV or vehicle)</h3>${field('unit.kind','Type',{required:true,options:[['RV','RV / travel trailer / motorhome'],['Vehicle','Other vehicle']]})}<div class="grid2">${field('unit.year','Year')}${field('unit.make','Make')}</div>${field('unit.model','Model')}${field('unit.vin','VIN / serial identifier')}${field('unit.stock','Stock number')}</div></div><div class="callout"><strong>Unit identity rule</strong>Provide at least one usable VIN / serial or stock number, even if both individual fields are marked optional. A hidden identifier may still be preserved on an existing saved unit.</div>`;
if(state.step===2)content=`<h2>Associate repair orders and work</h2><p class="subtitle">Use an existing RO when one is already known. A draft RO can be created without a number if this shop permits it. A single unit may have multiple simultaneous ROs.</p><div class="grid2">${field('ro','Repair order number')}${field('advisor','Responsible service writer')}</div>${field('scope','RO 1 · Line item 01',{long:true,placeholder:'Customer concern or receiving work scope'})}${state.extraLines.map((v,i)=>showRule('scope')?`<div class="field"><label>RO 1 · Line item ${String(i+2).padStart(2,'0')} ${requiredMode('scope')==='required'?'<span class="required-mark">*</span>':'<span class="optional-mark">Optional</span>'}</label><input data-extra-line="${i}" value="${esc(v)}" placeholder="Additional work or customer concern"></div>`:'').join('')}${showRule('scope')?'<button class="btn" id="addline" type="button">+ Add line item</button>':''}<div class="divider"></div>${state.extraROs.map((r,i)=>`<div class="grid2">${showRule('ro')?`<div class="field"><label>RO ${i+2} · Number ${requiredMode('ro')==='required'?'<span class="required-mark">*</span>':'<span class="optional-mark">Optional</span>'}</label><input data-extra-ro-number="${i}" value="${esc(r.number)}" placeholder="RO number if assigned"></div>`:''}${showRule('scope')?`<div class="field"><label>RO ${i+2} · Line item 01 ${requiredMode('scope')==='required'?'<span class="required-mark">*</span>':'<span class="optional-mark">Optional</span>'}</label><input data-extra-ro-scope="${i}" value="${esc(r.scope)}" placeholder="Work scope if known"></div>`:''}</div>`).join('')}<button class="btn secondary" id="addro" type="button">+ Add another RO</button><div class="callout"><strong>Business hierarchy</strong>${esc(accountLabel())} → ${esc(state.unit.make+' '+state.unit.model)} → ${1+state.extraROs.length} RO(s). ${esc(state.matchedRecord?'Existing unit reused. ':'')}One physical unit/location for all related ROs.</div>`;
if(state.step===3)content=`<h2>Confirm physical receipt</h2><p class="subtitle">Record where the unit actually is and whether it can safely be moved. The arrival area is not the final parking assignment.</p><div class="grid2">${field('arrival','Receiving / pickup location',{required:true,options:types.find(t=>t.id==='dropoff').spaces.map(x=>[x,x])})}${field('keyStatus','Key / packet status',{options:[['Cabinet intake','Keys checked in at service desk'],['With unit','Keys / packet with unit'],['Missing / unresolved','Missing keys or custody unresolved']]})}${field('promised','Customer pickup commitment (if agreed)',{type:'datetime-local',hint:'Never invent a promise or copy a shop estimate into a customer commitment.'})}${field('notes','Receipt notes / visible condition',{long:true,placeholder:'Existing damage, handling restrictions, photos to be added'})}</div><div class="callout warning"><strong>Next action after finishing</strong>The visit is recorded as checked in. A Move Unit action will be offered. A move request never changes the unit's confirmed physical location until the porter confirms delivery.</div>`;
root.innerHTML=title('Workflow 01 / Unit arrival','Service Writer Check-In','Receive the customer, identify the unit and its work, confirm physical arrival, and route it to the next operational department.')+msg()+`<div class="card">${stages()}${content}<div class="actions"><button class="btn" id="back" ${state.step===0?'disabled':''}>Back</button><div class="right"><button class="btn primary" id="next">${state.step===3?'Finish Check-In':'Continue'}</button></div></div></div>`;bind();root.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{state.checkinType=b.dataset.type;render()}));if(state.step===1){const lookup=root.querySelector('#lookup');lookup.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();state.lookupQuery=lookup.value;render()}});root.querySelector('#lookup-search').onclick=()=>{state.lookupQuery=lookup.value;render()};root.querySelector('#clear-new').onclick=()=>{state.customer={name:'',phone:'',email:''};state.unit={kind:'RV',year:'',make:'',model:'',vin:'',stock:''};state.ro='';state.scope='';state.extraLines=[];state.extraROs=[];state.matchedRecord='';state.notice='New customer/unit entry selected.';render()};root.querySelectorAll('[data-use-record]').forEach(b=>b.onclick=()=>{const x=demoDirectory.find(d=>d.unitId===b.dataset.useRecord);state.customer={name:x.name,phone:x.phone,email:x.email};state.unit={kind:x.kind,year:x.year,make:x.make,model:x.model,vin:x.vin,stock:x.stock};state.ro=x.ro;state.scope=x.scope;state.matchedRecord=x.unitId;state.notice='Matched existing customer and unit. Existing details have been reused.';render()})}if(state.step===2){const addline=root.querySelector('#addline');if(addline)addline.onclick=()=>{state.extraLines.push('');render()};root.querySelector('#addro').onclick=()=>{state.extraROs.push({number:'',scope:''});render()}}root.querySelector('#back').onclick=()=>{if(state.step>0)state.step--;render()};root.querySelector('#next').onclick=()=>{if(!validateStep())return;if(state.step===3)finish();else {state.step++;render()}}}
function validateStep(){const cfg=state.config.profiles[state.checkinType];const missing=(k,v)=>cfg[k]==='required'&&!String(v??'').trim();if(state.step===1){const required=['customer.name','customer.phone','customer.email','unit.vin','unit.stock','unit.year','unit.make','unit.model'];let absent=required.filter(k=>missing(k,k.includes('.')?state[k.split('.')[0]][k.split('.')[1]]:''));if(absent.length){state.error='Required information missing: '+absent.map(k=>configurableFields.find(f=>f.path===k).title).join(', ')+'.';render();return false}if(!state.unit.vin.trim()&&!state.unit.stock.trim()){state.error='At least one unit identifier is required: VIN / serial or stock number.';render();return false}if(state.customer.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.customer.email.trim())){state.error='Enter a valid email address or leave it blank when the shop profile allows that.';render();return false}}if(state.step===2){let absent=[];if(missing('ro',state.ro))absent.push('RO number');if(missing('scope',state.scope))absent.push('Line item');if(missing('advisor',state.advisor))absent.push('Responsible service writer');for(const [i,r] of state.extraROs.entries()){if(missing('ro',r.number))absent.push('RO '+(i+2)+' number');if(missing('scope',r.scope))absent.push('RO '+(i+2)+' line item')}if(cfg.scope==='required'&&state.extraLines.some(x=>!x.trim()))absent.push('Additional line item description');const populated=[state.ro,...state.extraROs.map(x=>x.number)].map(x=>x.trim()).filter(Boolean);if(new Set(populated).size!==populated.length)absent.push('RO numbers must be unique');if(absent.length){state.error='Check-in requires: '+absent.join(', ')+'.';render();return false}}if(state.step===3&&missing('keyStatus',state.keyStatus)){state.error='Record key custody or explicitly flag it as missing.';render();return false}return true}
function event(type,label,details){state.eventLog.push({id:'e'+(state.eventLog.length+1),type,label,details,at:now(),visit:state.visitId,unit:unitIdentifier()})}
function finish(){if(state.done)return;state.done=true;state.visitId='V-2026-001';state.location=state.arrival;state.move.pickup=state.location;state.move.type=state.urgency==='waiter'?'waiter':state.checkinType==='inventory'?'pdi':'storage';state.move.space='';event('checkin','Service Writer Check-In',`${accountLabel()} · ${[state.ro,...state.extraROs.map(x=>x.number)].filter(Boolean).join(', ')||'Draft RO'} · ${state.arrival}`);state.notice='Check-in recorded in the prototype. Recommended next action: Move Unit.';render()}
function postCheckin(){const t=types.find(x=>x.id===state.move.type);let queued=state.requests.find(r=>r.status!=='delivered'&&r.status!=='canceled');root.innerHTML=title('Workflow 01 / Next action','Check-In Complete','The unit has been received. Select its next destination by area or space type; specific space allocation is optional.')+msg()+`<div class="kpi"><div class="card"><span>Customer</span><strong>${esc(accountLabel())}</strong></div><div class="card"><span>Unit / identifier</span><strong>${esc(unitIdentifier().slice(-12))}</strong></div><div class="card"><span>Confirmed position</span><strong>${esc(state.location)}</strong></div></div><div class="two-col"><section class="card"><div class="card-head"><div><h2>Move Unit</h2><p class="muted">System recommendation: ${esc(state.urgency==='waiter'?'Waiter Way':state.checkinType==='inventory'?'PDI Staging':'Service Storage')}</p></div><span class="flag blue">Next action</span></div>${queued?`<div class="callout warning"><strong>Move already in progress</strong>${esc(queued.id)} is ${esc(queued.status)}. Open Porter Queue to progress it.</div>`:''}<div class="grid2">${field('move.pickup','Pickup location',{options:[state.location,state.arrival,...types.flatMap(x=>x.spaces)].filter((x,i,a)=>a.indexOf(x)===i).map(x=>[x,x])})}${field('move.type','Destination space / area type',{options:types.filter(x=>x.id!=='dropoff').map(x=>[x.id,x.name])})}</div>${field('move.space','Specific numbered space (optional)',{options:[['','No specific space · assign at dispatch'],...t.spaces.map(x=>[x,x])]})}${state.move.type==='bay'?field('move.receiver','Receiving assignment · Service Bay',{options:[['foreman','No technician assigned · notify foreman'],['technician','Demo technician already assigned']]}) : ''}<div class="grid2">${field('move.priority','Priority',{options:[['normal','Normal'],['urgent','Urgent']]})}${field('move.note','Porter instructions',{placeholder:'Handling, key bag, access notes'})}</div><div class="actions"><button class="btn" id="skip">Skip for now</button><div class="right"><button class="btn primary" id="request" ${queued||state.urgency==='restricted'||state.keyStatus==='Missing / unresolved'?'disabled':''}>${state.urgency==='restricted'||state.keyStatus==='Missing / unresolved'?'Supervisor review required':'Request Move'}</button></div></div></section><aside class="card"><h3>Check-In Summary</h3><ul class="list"><li><b>Processing:</b> ${esc(state.checkinType==='customer'?'Customer service':'New inventory / PDI')}</li><li><b>Received:</b> ${esc(short(now()))}</li><li><b>ROs:</b> ${esc([state.ro,...state.extraROs.map(x=>x.number)].filter(Boolean).join(', ')||'Draft RO number pending')}</li><li><b>Work lines:</b> ${esc(1+state.extraLines.length+state.extraROs.length)} line(s)</li><li><b>Keys:</b> ${esc(state.keyStatus)}</li><li><b>Physical location:</b> ${esc(state.location)}</li></ul><div class="divider"></div><button class="btn secondary" id="open-customer">Open customer timeline</button></aside></div>`;bind();root.querySelector('#open-customer').onclick=()=>nav('customer');root.querySelector('#skip').onclick=()=>{state.notice='Move left pending; the unit remains at its confirmed pickup position.';render()};let req=root.querySelector('#request');req.onclick=()=>{if(state.move.space&&!t.spaces.includes(state.move.space)){state.error='Selected space no longer matches the selected destination type.';render();return}if(state.move.pickup!==state.location){state.error='Pickup location differs from confirmed location. A supervisor must first reconcile its actual position.';render();return}const r={id:`MOVE-${String(state.requests.length+1).padStart(3,'0')}`,status:'requested',from:state.location,type:state.move.type,to:state.move.space,priority:state.move.priority,note:state.move.note,receiver:state.move.receiver,claimedBy:'',created:now()};state.requests.push(r);event('move_requested','Movement requested',`${r.from} → ${t.name}${r.to?' / '+r.to:''}`);addNotice('porter','New move request · '+r.id,'Pickup '+r.from+' → '+t.name+(r.to?' / '+r.to:' · space to be assigned'),r.id,true);state.notice='Movement request placed in Porter Queue. Actual unit position has not changed.';render()}}
function porter(){let active=state.requests.filter(r=>r.status!=='delivered'&&r.status!=='canceled');root.innerHTML=title('Workflow 02 / Physical movements','Porter Queue','Porters claim a move, locate the unit, resolve the final parking position when required and confirm actual delivery.')+msg()+`<div class="kpi"><div class="card"><span>Awaiting claim</span><strong>${active.filter(r=>r.status==='requested').length}</strong></div><div class="card"><span>In progress</span><strong>${active.filter(r=>r.status==='claimed'||r.status==='picked_up').length}</strong></div><div class="card"><span>Unit location</span><strong>${esc(state.location)}</strong></div></div><div class="card"><h2>Movement assignments</h2><p class="subtitle">Only a confirmed delivery updates the customer and dealership map. A type-only request is a valid assignment.</p>${state.requests.length?state.requests.map(r=>`<div class="queue-card"><div class="queue-top"><div class="tagline"><b>${esc(r.id)}</b><span class="flag ${r.status==='delivered'?'':'pending'}">${esc(r.status.replace('_',' '))}</span></div><span class="pill">${esc(r.priority.toUpperCase())}</span></div><h3>${esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)} · ${esc(unitIdentifier().slice(-6))}</h3><div class="chips"><span class="badge-outline">From ${esc(r.from)}</span><span class="badge-outline">Destination ${esc(types.find(t=>t.id===r.type).name)}</span><span class="badge-outline">${esc(r.to||'Exact space not specified')}</span></div><p class="muted">${esc(accountLabel())} · ${esc(roLabel())} · Keys: ${esc(state.keyStatus)} ${r.note?'· '+esc(r.note):''}</p>${r.status==='requested'?`<button class="btn primary" data-claim="${r.id}">Claim Move</button>`:r.status==='claimed'?`<button class="btn primary" data-pickup="${r.id}">Confirm Pickup</button>`:r.status==='picked_up'?`<div class="field"><label>Final confirmed destination space</label><select data-arrival="${r.id}">${types.find(t=>t.id===r.type).spaces.map(s=>`<option ${r.t root.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{let r=state.requests.find(x=>x.id===b.dataset.claim);if(r.status!=='requested')return;r.status='claimed';r.claimedBy='Demo Porter';event('move_claimed','Porter claimed move',r.id+' · Demo Porter');addNotice('service_writer','Porter claimed '+r.id,'Demo Porter accepted responsibility for the move from '+r.from,r.id,false);state.notice='Claim recorded. In production this operation must be atomic so two porters cannot claim the same move.';render()});root.querySelectorAll('[data-pickup]').forEach(b=>b.onclick=()=>{let r=state.requests.find(x=>x.id===b.dataset.pickup);if(r.status!=='claimed')return;r.status='picked_up';event('move_picked_up','Unit picked up',`${r.id} · ${r.from}`);state.notice='Pickup confirmed; the last confirmed map location remains unchanged until delivery.';render()});root.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>{let r=state.requests.find(x=>x.id===b.dataset.deliver);if(r.status!=='picked_up')return;let selected=root.querySelector(`[data-arrival="${r.id}"]`).value;let occupied=state.requests.find(x=>x.id!==r.id&&x.status==='delivered'&&x.to===selected);if(occupied){state.error='Space already occupied in this demo. Choose a different destination.';render();return}r.to=selected;r.status='delivered';state.location=selected;state.move.pickup=selected;event('move_delivered','Moved to '+types.find(t=>t.id===r.type).name,`${r.from} → ${r.to} · Demo Porter`);const receiverRole=r.type==='bay'?(r.receiver==='technician'?'technician':'foreman'):({storage:'service_dispatch',wash:'wash',detail:'detail',pdi:'pdi',waiter:'service_writer'}[r.type]||'foreman');addNotice('service_writer','Unit delivered · '+r.id,'Unit at '+r.to+'; delivered by Demo Porter. Receiving queue: '+receiverRole,r.id,receiverRole==='service_writer');if(receiverRole!=='service_writer')addNotice(receiverRole,'Unit ready for receiving · '+r.id,'At '+r.to+' · '+roLabel()+' · Keys: '+state.keyStatus,r.id,true);sta const notificationRoles=[['service_writer','Service Writer'],['porter','Porter'],['technician','Technician'],['foreman','Foreman / Dispatch'],['service_dispatch','Service Dispatch'],['pdi','PDI'],['wash','Wash'],['detail','Detail']];
function addNotice(role,titleText,detail,moveId,actionable){
  state.notifications.push({id:'NOT-'+String(state.notifications.length+1).padStart(3,'0'),role,title:titleText,detail,moveId,actionable,read:false,accepted:false,created:now()});
}
function inbox(){
  const mine=state.notifications.filter(n=>n.role===state.viewerRole);
  const unread=mine.filter(n=>!n.read).length;
  const picker=notificationRoles.map(x=>'<option value="'+x[0]+'" '+(state.viewerRole===x[0]?'selected':'')+'>'+esc(x[1])+'</option>').join('');
  const cards=mine.slice().reverse().map(n=>'<article class="queue-card"><div class="queue-top"><div class="tagline"><strong>'+esc(n.title)+'</strong><span class="flag '+(n.actionable?'pending':'blue')+'">'+(n.actionable?'Action required':'Update')+'</span></div><span class="pill">'+(n.read?'Read':'New')+'</span></div><p class="muted">'+esc(n.detail)+'</p><div class="chips"><span class="badge-outline">'+esc(n.moveId)+'</span><span class="badge-outline">'+esc(tm(n.created))+'</span></div><button class="btn '+(n.read?'':'primary')+'" data-open-notice="'+esc(n.id)+'">Open unit details</button>'+(state.openNotice===n.id?'<div class="callout"><strong>Unit and handoff context</strong><div><b>Unit:</b> '+esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)+' · '+esc(unitIdentifier().slice(-6))+'</div><div><b>Customer/account:</b> '+esc(accountLabel())+'</div><div><b>RO:</b> '+esc(roLabel())+'</div><div><b>Confirmed location:</b> '+esc(state.location)+'</div><div><b>Keys:</b> '+esc(state.keyStatus)+'</div><div><b>Handoff:</b> '+esc(n.detail)+'</div><div class="actions">'+(n.role==='porter'?'<button class="btn primary" data-open-porter="'+esc(n.id)+'">Open Porter Queue</button>':n.actionable&&!n.accepted?'<button class="btn primary" data-accept-work="'+esc(n.id)+'">Acknowledge receiving task</button>':n.accepted?'<span class="flag">Acknowledged · work remains assigned</span>':'<span class="muted">Delivery status is informational.</span>')+'</div></div>':'')+'</article>').join('');
  root.innerHTML=title('Operational handoff / Demonstration','Notifications & My Work','Select a dealership role to review its persistent work queue and updates. This is a browser-only simulation, not a live multi-user inbox.')+msg()+'<div class="card"><div class="grid2"><div class="field"><label>Viewing as (demo role)</label><select id="viewer-role">'+picker+'</select></div><div class="callout"><strong>'+unread+' unread · '+mine.filter(n=>n.actionable&&!n.accepted).length+' actions</strong>Opening a notification marks it read, not accepted or complete. Every assignment retains a named user or accountable team queue.</div></div>'+(cards||'<div class="empty">No notifications for this role yet. Complete check-in and request a move, then select Porter here.</div>')+'</div>';
  root.querySelector('#viewer-role').onchange=e=>{state.viewerRole=e.target.value;state.openNotice='';render()};
  root.querySelectorAll('[data-open-notice]').forEach(b=>b.onclick=()=>{const n=state.notifications.find(x=>x.id===b.dataset.openNotice);n.read=true;state.openNotice=n.id;render()});
  root.querySelectorAll('[data-open-porter]').forEach(b=>b.onclick=()=>nav('porter'));
  root.querySelectorAll('[data-accept-work]').forEach(b=>b.onclick=()=>{const n=state.notifications.find(x=>x.id===b.dataset.acceptWork);n.accepted=true;state.notice='Receiving task acknowledged in demo. This does not complete work or authorize repairs.';render()});
}

function customer(){const cutoff=state.filter==='all'?-Infinity:Date.now()-Number(state.filter)*86400000;const events=state.eventLog.filter(e=>e.visit===state.visitId&&new Date(e.at).getTime()>=cutoff&&(state.unitFilter==='all'||e.unit===unitIdentifier()));const hasVisit=state.done&&events.length>0;const expanded=state.expanded;root.innerHTML=title('Customer record / Primary view',accountLabel(),'The customer timeline is the first substantive component. Service visits stay grouped, and their detailed events expand beneath the main history.')+`<div class="card"><div class="card-head"><div><div class="eyebrow">Customer profile</div><div class="tagline"><span class="badge-outline">${esc(state.customer.phone||'No phone')}</span><span class="badge-outline">${esc(state.customer.email||'No email')}</span></div></div><button class="btn secondary" id="checkin-new">${hasVisit?'View current check-in':'Start check-in'}</button></div></div><div class="card"><div class="card-head"><div><h2>Customer Timeline</h2><p class="muted">Service visits, milestones, recommendations and future reminders.</p></div><span class="pill">Primary customer component</span></div><div class="grid2"><div class="field"><label>Time period</label><select id="period"><option value="30" ${state.filter==='30'?'selected':''}>Last 30 days</option><option value="90" ${state.filter==='90'?'selected':''}>Last 90 days</option><option value="365" ${state.filter==='365'?'selected':''}>Last 12 months</option><option value="all" ${state.filter==='all'?'selected':''}>All time</option></select></div><div class="field"><label>Unit</label><select id="unitselect"><option value="all">All customer units</option><option value="current" ${state.unitFilter==='current'?'selected':''}>${esc(state.unit.make+' '+state.unit.model+' · '+unitIdentifier().slice(-6))}</option></select></div></div><div class="timeline"><div class="timeline-card future"><div class="timeline-header"><div><div class="timeline-title">Future follow-up / recommendation</div><span class="muted">Scheduled · Example only</span></div><span class="flag pending">Future</span></div><p class="muted">Recommended service and advisor follow-ups appear here as future items, not as work already performed.</p></div>${hasVisit?`<div class="timeline-card"><div class="timeline-header"><div><div class="timeline-title">Service Visit · ${esc(short(events[0].at))}</div><p class="muted">${esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)} · ${esc([state.ro,...state.extraROs.map(x=>x.number)].filter(Boolean).join(', ')||'Draft RO')} · Current: ${esc(state.location)}</p></div><button class="btn secondary" id="expand">${expanded?'Hide details':'Expand visit'}</button></div>${expanded?`<div class="timeline-inner">${events.map(e=>`<div class="event"><time>${esc(tm(e.at))}</time><div><b>${esc(e.label)}</b><div class="muted">${esc(e.details)}</div></div></div>`).join('')}</div>`:''}</div>`:`<div class="empty">No recorded service visit in this prototype.<br>Complete check-in to see its timeline group and expandable milestones.</div>`}</div></div><div class="card"><div class="card-head"><div><h2>Customer Units</h2><p class="muted">Each unit has a dedicated history, even if its owner changes later.</p></div><span class="pill">1 unit in demo</span></div><div class="unitcard"><div><b>${esc(state.unit.year+' '+state.unit.make+' '+state.unit.model)}</b><p class="muted">${esc(state.unit.kind)} · Identifier ${esc(unitIdentifier())} · ${hasVisit?'On site at '+state.location:'No active visit recorded'}</p></div><button class="btn" id="history">View history</button></div></div>`;root.querySelector('#checkin-new').onclick=()=>nav('checkin');root.querySelector('#history').onclick=()=>{state.expanded=true;render();window.scrollTo({top:0,behavior:'smooth'})};root.querySelector('#period').onchange=e=>{state.filter=e.target.value;render()};root.querySelector('#unitselect').onchange=e=>{state.unitFilter=e.target.value;render()};if(root.querySelector('#expand'))root.querySelector('#expand').onclick=()=>{state.expanded=!state.expanded;render()}}
function map(){root.innerHTML=title('Property setup / Future module','Location Type & Map Builder','The complete map editor is a dedicated later build. This prototype uses the same destination-type contract without fabricating a map or availability system.')+`<div class="callout warning"><strong>Advanced editor intentionally not simulated</strong>Production will support map image upload, zoom/pan, arrays, rotation, shaded multi-unit areas, numbered-space templates, published revisions, accurate capacity and concurrent editing.</div><div class="card"><div class="card-head"><div><h2>Location type registry</h2><p class="muted">Every numbered space requires a type and receives a code built from its configured abbreviation and number.</p></div><span class="flag pending">Fixture only</span></div>${types.map(t=>`<div class="ro-row"><div><b>${esc(t.name)}</b><p class="muted">Prefix: ${esc(t.prefix)} · ${t.area?'Shared arrival area':'Individual positions'} · ${t.spaces.length} example positions</p></div><span class="badge-outline">${esc(t.spaces.slice(0,2).join(', '))}</span></div>`).join('')}</div><div class="card"><h2>Location selection rule</h2><div class="callout"><strong>Type required · Exact space optional</strong>Service writers request a move to Service Storage or another operational type. Porters/foremen choose a permissible exact destination based on the site's allocation policy, and only their confirmed delivery updates occupancy.</div></div>`}
function settingsPage(){const profile=state.settingsProfile;const fieldRows=configurableFields.reduce((acc,f)=>{(acc[f.group]??=[]).push(f);return acc},{});const modeOptions=[['required','Required'],['optional','Optional'],['hidden','Hidden']];let fieldsHtml=Object.entries(fieldRows).map(([group,items])=>`<div class="settings-group"><h3>${esc(group)}</h3>${items.map(f=>`<div class="setting-row"><div><strong>${esc(f.title)}</strong><p class="muted">${esc(f.help)}</p></div><select data-setting-field="${esc(f.path)}" aria-label="${esc(f.title)} requirement">${modeOptions.map(([value,label])=>`<option value="${value}" ${state.config.profiles[profile][f.path]===value?'selected':''}>${label}</option>`).join('')}</select></div>`).join('')}</div>`).join('');let appearance=`<div class="callout"><strong>Shared design system</strong>One set of semantic color tokens controls the sidebar, background, forms, cards, buttons and timeline across every screen. Changes apply instantly to this prototype and persist in this browser.</div><div class="theme-grid">${themes.map(t=>`<button class="theme-card ${state.config.theme===t.id?'selected':''}" data-theme-choice="${t.id}"><span class="theme-swatch" style="background:${t.swatch}"></span><strong>${esc(t.title)}</strong><small>${esc(t.detail)}</small><span class="theme-selected">${state.config.theme===t.id?'Current theme':'Use theme'}</span></button>`).join('')}</div>`;
root.innerHTML=title('Dealership configuration / Global','Settings','Set check-in requirements per workflow and adjust the shared OneShop appearance without modifying each page.')+msg()+`<div class="settings-tabs"><button class="btn ${state.settingsTab==='fields'?'primary':''}" data-settings-tab="fields">Check-In Fields</button><button class="btn ${state.settingsTab==='appearance'?'primary':''}" data-settings-tab="appearance">Appearance</button></div>${state.settingsTab==='fields'?`<div class="card"><div class="card-head"><div><h2>Check-in requirements</h2><p class="muted">These rules apply to this shop's ${profile==='customer'?'Customer Service':'New Inventory'} check-ins. Every field can be required, optional, or hidden.</p></div><span class="pill">Saved in browser · Demo</span></div><div class="seg"><button class="${profile==='customer'?'selected':''}" data-profile="customer"><strong>Customer Service</strong><span>Service, diagnosis and warranty visits</span></button><button class="${profile==='inventory'?'selected':''}" data-profile="inventory"><strong>New Inventory</strong><span>Receiving, stock units and PDI</span></button></div><div class="callout"><strong>Mandatory integrity rule</strong>At least one unit identifier (VIN / serial or stock number) must be provided. You may require either or both. Hiding both is not permitted. A physical receiving location is also always required; user and branch are supplied by the authenticated session in production.</div>${fieldsHtml}<div class="actions"><button class="btn" id="reset-rules">Restore recommended defaults for this flow</button><button class="btn primary" id="preview-rules">Preview Check-In</button></div></div>`:`<div class="card"><h2>Application appearance</h2><p class="subtitle">Select a global palette. Production will allow an organization administrator to manage theme tokens centrally for the entire dealership.</p>${appearance}<div class="actions"><button class="btn" id="reset-theme">Restore approved blue theme</button><button class="btn primary" id="back-to-intake">Return to Check-In</button></div></div>`}<div class="card"><h3>Deployment and permissions</h3><p class="muted">This offline prototype saves only configuration in localStorage. Production settings belong to an organization/branch configuration record with versioning and authorization; ordinary service writers should not be able to change required fields. The server must validate the active profile when check-in is submitted, including concurrent changes to site policy.</p></div>`;
root.querySelectorAll('[data-settings-tab]').forEach(b=>b.onclick=()=>{state.settingsTab=b.dataset.settingsTab;state.error='';state.notice='';render()});root.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{state.settingsProfile=b.dataset.profile;state.error='';state.notice='';render()});root.querySelectorAll('[data-setting-field]').forEach(el=>el.onchange=()=>{const path=el.dataset.settingField;const value=el.value;const rules=state.config.profiles[profile];const old=rules[path];rules[path]=value;if(rules['unit.vin']==='hidden'&&rules['unit.stock']==='hidden'){rules[path]=old;state.error='VIN and stock number cannot both be hidden. Keep at least one visible unit identifier.';render();return}persistSettings();state.error='';state.notice='Requirements for '+(profile==='customer'?'Customer Service':'New Inventory')+' saved in this browser.';render()});root.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));const reset=root.querySelector('#reset-rules');if(reset)reset.onclick=()=>{state.config.profiles[profile]=copy(defaultRules[profile]);persistSettings();state.notice='Recommended '+(profile==='customer'?'Customer Service':'New Inventory')+' rules restored.';render()};const preview=root.querySelector('#preview-rules');if(preview)preview.onclick=()=>{state.checkinType=profile;state.step=1;state.done=false;nav('checkin')};const resetTheme=root.querySelector('#reset-theme');if(resetTheme)resetTheme.onclick=()=>setTheme('classic');const back=root.querySelector('#back-to-intake');if(back)back.onclick=()=>nav('checkin')}
function render(){window.scrollTo({top:0,behavior:'auto'});({checkin,porter,inbox,customer,map,settings:settingsPage})[state.page]();const count=state.notifications.filter(n=>n.role===state.viewerRole&&!n.read).length;const badge=document.getElementById('inbox-count');if(badge)badge.textContent=count;}
document.documentElement.dataset.theme=state.config.theme;
